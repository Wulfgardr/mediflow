name: MediFlowAppleApp
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  MediFlowMacPackage:
    path: ../MediFlowMac
targets:
  MediFlowMobileApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MediFlowMobileApp
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: MediFlowMacPackage
        product: MediFlowAppleShared
    info:
      path: Sources/MediFlowMobileApp/Info.plist
      properties:
        CFBundleDisplayName: MediFlow
        CFBundleShortVersionString: 0.8.6
        CFBundleVersion: "86"
        LSApplicationCategoryType: public.app-category.medical
        UIApplicationSupportsIndirectInputEvents: true
        # @Codex: local navigation only; never pairing or an authenticated command.
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.mediflow.navigation
            CFBundleURLSchemes: [mediflow]
        # Local-network discovery: required so Bonjour home-base discovery and
        # pairing work on a real device. Guarded by check-apple-network-entitlements.sh.
        NSLocalNetworkUsageDescription: "MediFlow cerca il tuo home-base sulla rete locale per collegarsi in modo paired e cifrato."
        NSBonjourServices:
          - _mediflow-homebase._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mediflow.mobile
        PRODUCT_NAME: MediFlow
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 0.8.6
        CURRENT_PROJECT_VERSION: 86
        SUPPORTS_MACCATALYST: NO
  MediFlowMacApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/MediFlowMacApp
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: MediFlowMacPackage
        product: MediFlowAppleShared
    info:
      path: Sources/MediFlowMacApp/Info.plist
      properties:
        CFBundleDisplayName: MediFlow
        CFBundleShortVersionString: 0.8.6
        CFBundleVersion: "86"
        LSApplicationCategoryType: public.app-category.medical
        # Local-network discovery for the home-base Bonjour service. Guarded by
        # check-apple-network-entitlements.sh.
        NSLocalNetworkUsageDescription: "MediFlow cerca il tuo home-base sulla rete locale per collegarsi in modo paired e cifrato."
        NSBonjourServices:
          - _mediflow-homebase._tcp
        # Recording remains macOS 26-gated; the general app deployment stays 14.
        NSMicrophoneUsageDescription: "MediFlow usa il microfono solo dopo il tuo consenso per trascrivere localmente la visita; l'audio non viene salvato."
        # @Codex: same navigation grammar as iOS, scoped to the receiving window.
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.mediflow.navigation
            CFBundleURLSchemes: [mediflow]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Same bundle id as iOS for a single universal-purchase app record.
        PRODUCT_BUNDLE_IDENTIFIER: com.mediflow.mobile
        PRODUCT_NAME: MediFlow
        MARKETING_VERSION: 0.8.6
        CURRENT_PROJECT_VERSION: 86
  MediFlowMobileAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MediFlowMobileAppUITests
    dependencies:
      - target: MediFlowMobileApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediflow.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MediFlowMobileApp
schemes:
  MediFlowMobileApp:
    build:
      targets:
        MediFlowMobileApp: all
    test:
      targets:
        - MediFlowMobileAppUITests
  MediFlowMacApp:
    build:
      targets:
        MediFlowMacApp: all
