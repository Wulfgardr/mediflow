name: Never Regress Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  never-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:never-regress
