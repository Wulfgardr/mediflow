name: Cross-platform (Win/Linux/macOS)

# Safety net for WUL-375: prove that install, build and boot stay green on
# Windows and Linux, not only macOS. Node 24 is the single install/build/start
# contract shared by .nvmrc, package engines, launchers and native bundles.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-bootstrap:
    name: Native launcher bootstrap (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Build native Windows bootstrap (development only)
        if: hashFiles(format('scripts/windows-launcher-bootstrap/prebuilds/win32-{0}/system-directory.node', matrix.arch)) == '' && hashFiles(format('scripts/windows-launcher-bootstrap/prebuilds/win32-{0}/manifest.json', matrix.arch)) == ''
        run: node scripts/prepare-windows-launcher-bootstrap.mjs build
      - name: Verify delivered artifact and OS path
        run: node scripts/prepare-windows-launcher-bootstrap.mjs verify
      - name: Verify native bootstrap with hostile cwd PATH and root variables
        run: node scripts/prepare-windows-launcher-bootstrap.mjs verify-shadow
      - name: Prove source-first before npm ci
        run: node scripts/prepare-windows-launcher-bootstrap.mjs source-first
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-launcher-bootstrap-${{ matrix.arch }}
          path: |
            scripts/windows-launcher-bootstrap/prebuilds/win32-${{ matrix.arch }}/system-directory.node
            scripts/windows-launcher-bootstrap/prebuilds/win32-${{ matrix.arch }}/manifest.json
          if-no-files-found: error

  headless-contracts:
    needs: windows-bootstrap
    name: Headless contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows' && hashFiles('scripts/windows-launcher-bootstrap/prebuilds/win32-x64/system-directory.node') == '' && hashFiles('scripts/windows-launcher-bootstrap/prebuilds/win32-x64/manifest.json') == ''
        with:
          name: windows-launcher-bootstrap-x64
          path: scripts/windows-launcher-bootstrap/prebuilds/win32-x64
      - name: Verify received native bootstrap
        if: runner.os == 'Windows'
        run: node scripts/prepare-windows-launcher-bootstrap.mjs verify
      - name: Install (npm ci)
        run: npm ci
      - name: Deny DB, Web, native and network imports in portable surfaces
        run: npm run check:headless-portable-imports
      - name: Typecheck profile contracts without DOM or framework types
        run: node node_modules/typescript/bin/tsc -p packages/patient-profile-contracts/tsconfig.json
      - name: Run the shared AIP, Mini, MCP and profile conformance contracts
        run: npm run test:headless-portable
      - name: Verify cross-platform launcher identity and safe reuse
        run: npm run test:launcher-helpers
      - name: Verify the native development launcher
        if: runner.os == 'macOS'
        run: npm run test:native-launcher

  build-start:
    needs: windows-bootstrap
    name: build + start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/native/MediFlowMac/Tests/MediFlowCoreTests/Fixtures/medical_fixture.db
      - name: Verify sparse production source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test ! -e native/MediFlowMac/Tests/MediFlowCoreTests/Fixtures/medical_fixture.db
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows' && hashFiles('scripts/windows-launcher-bootstrap/prebuilds/win32-x64/system-directory.node') == '' && hashFiles('scripts/windows-launcher-bootstrap/prebuilds/win32-x64/manifest.json') == ''
        with:
          name: windows-launcher-bootstrap-x64
          path: scripts/windows-launcher-bootstrap/prebuilds/win32-x64
      - name: Verify received native bootstrap
        if: runner.os == 'Windows'
        run: node scripts/prepare-windows-launcher-bootstrap.mjs verify
      - name: Install (npm ci)
        run: npm ci
      - name: Verify better-sqlite3 native binding loads
        run: node -e "const db=require('better-sqlite3')(':memory:'); console.log('better-sqlite3 query result:', db.prepare('select 1 as x').get().x);"
      - name: Flag better-sqlite3 source compile (non-fatal visibility)
        # Block scalar: the JS ternary contains ' : ' which a plain YAML scalar
        # would parse as a mapping separator (this exact line broke the workflow).
        run: >-
          node -e "const fs=require('fs'); const compiled=fs.existsSync('node_modules/better-sqlite3/build/Release/obj'); console.log(compiled ? 'WARNING: better-sqlite3 compiled from source (no matching prebuild for this Node/OS)' : 'OK: better-sqlite3 prebuilt binary used');"
      - name: Verify Windows SQLite durability and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('mediflow-sqlite-' + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $env:MEDIFLOW_DATA_DIR = $fixture
          $env:MEDIFLOW_E2E_DISABLE_LEGACY_COPY = '1'
          try {
            # Each file owns multi-process drain/crash tests and synchronous volume flushes.
            # Serialize files on the shared runner; concurrency inside those tests stays intact.
            node scripts/run-strip-types.mjs --test --test-concurrency=1 lib/sqlite-durability.test.ts lib/sqlite-maintenance-admission.test.ts lib/sqlite-swap-recovery.test.ts lib/sqlite-repair.test.ts lib/backup-total-roundtrip.test.ts lib/scheduled-backup-runtime-contract.test.ts
            if ($LASTEXITCODE -ne 0) { throw 'Windows SQLite durability and recovery tests failed' }
          } finally {
            Remove-Item -LiteralPath $fixture -Recurse -Force
          }
      - name: Unified launcher smoke (first build and verified boot)
        run: node scripts/ci-start-smoke.mjs

  static-checks:
    name: lint + typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
