name: Cross-platform (Win/Linux/macOS)

# Safety net for WUL-375: prove that install, build and boot stay green on
# Windows and Linux, not only macOS. Node 24 is the single install/build/start
# contract shared by .nvmrc, package engines, launchers and native bundles.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  headless-contracts:
    name: Headless contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      - name: Deny DB, Web, native and network imports in portable surfaces
        run: npm run check:headless-portable-imports
      - name: Run the shared AIP, Mini and MCP contracts
        run: npm run test:headless-portable
      - name: Verify cross-platform launcher identity and safe reuse
        run: npm run test:launcher-helpers
      - name: Parse the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './Start-MediFlow.ps1'),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Verify the native development launcher
        if: runner.os == 'macOS'
        run: npm run test:native-launcher

  build-start:
    name: build + start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      - name: Verify better-sqlite3 native binding loads
        run: node -e "const db=require('better-sqlite3')(':memory:'); console.log('better-sqlite3 query result:', db.prepare('select 1 as x').get().x);"
      - name: Flag better-sqlite3 source compile (non-fatal visibility)
        # Block scalar: the JS ternary contains ' : ' which a plain YAML scalar
        # would parse as a mapping separator (this exact line broke the workflow).
        run: >-
          node -e "const fs=require('fs'); const compiled=fs.existsSync('node_modules/better-sqlite3/build/Release/obj'); console.log(compiled ? 'WARNING: better-sqlite3 compiled from source (no matching prebuild for this Node/OS)' : 'OK: better-sqlite3 prebuilt binary used');"
      - name: Build
        run: npm run build
      - name: Start smoke (boot on this OS)
        run: node scripts/ci-start-smoke.mjs

  static-checks:
    name: lint + typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
