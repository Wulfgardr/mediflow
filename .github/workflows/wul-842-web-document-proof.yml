name: WUL-842 Web document identity proof
on:
  push:
    branches: [codex/WUL-842-web-document-proof]
permissions:
  contents: read
jobs:
  proof:
    name: Web document identity ${{ matrix.proof.verdict }} (Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        proof:
          - verdict: full-diff
            revision: b357222d6
    env:
      MEDIFLOW_NEXT_DIST_DIR: .next-e2e
      E2E_DOCUMENTS_SYNTHETIC_ONLY: '1'
      FORCE_COLOR: '0'
      PLAYWRIGHT_HTML_OPEN: never
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - run: git switch --detach ${{ matrix.proof.revision }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run prepare:dependencies
      - name: Verify browser sandbox
        run: |
          npx --no-install playwright install ffmpeg
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test'
          const browser = await chromium.launch({ channel: process.env.E2E_BROWSER_CHANNEL, chromiumSandbox: true,
            args: ['--proxy-server=http://127.0.0.1:1', '--proxy-bypass-list=<-loopback>;localhost;127.0.0.1;[::1]'] })
          console.log(browser.version())
          await browser.close()
          NODE
      - name: Provision pinned local OCR artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync('scripts/anydoc-tesseract-artifacts.json', 'utf8'));
          const core = 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/';
          const data = 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/';
          const sources = {
            'tesseract-core-lstm.js': core + 'tesseract-core-lstm.js',
            'tesseract-core-lstm.wasm': core + 'tesseract-core-lstm.wasm',
            'LICENSE': core + 'LICENSE',
            'ita.traineddata': data + 'ita.traineddata',
            'tessdata-LICENSE': data + 'LICENSE',
          };
          const verified = [];
          for (const file of manifest.files) {
            if (!Object.hasOwn(sources, file.name)) throw new Error('Unknown OCR artifact');
            const response = await fetch(sources[file.name], { signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error(`OCR artifact ${file.name}: HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (bytes.length !== file.byteLength || createHash('sha256').update(bytes).digest('hex') !== file.sha256)
              throw new Error(`OCR artifact ${file.name}: size or SHA-256 mismatch`);
            verified.push([file.name, bytes]);
          }
          fs.mkdirSync(manifest.directory);
          for (const [name, bytes] of verified) fs.writeFileSync(path.join(manifest.directory, name), bytes, { flag: 'wx' });
          console.log(`Local OCR: ${verified.length} pinned artifacts verified.`);
          NODE
          npm run check:anydoc-desktop-ocr
      - name: Build synthetic isolated runtime
        run: |
          test -z "$(git status --porcelain)"
          export MEDIFLOW_APP_REVISION="$(git rev-parse --short=12 HEAD)"
          export MEDIFLOW_APP_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          export MEDIFLOW_APP_WORKTREE_HASH=clean
          unset MEDIFLOW_APP_SOURCE_FINGERPRINT MEDIFLOW_APP_FINGERPRINT
          unset E2E_BASE_URL E2E_PIN MEDIFLOW_RUNTIME_TWIN NEXT_PUBLIC_MEDIFLOW_RUNTIME_TWIN
          E2E_BUILD_DATA="$(mktemp -d "${RUNNER_TEMP}/mediflow-build-data.XXXXXX")"
          export MEDIFLOW_DATA_DIR="${E2E_BUILD_DATA}"
          export MEDIFLOW_E2E_DATA_DIR="${E2E_BUILD_DATA}"
          export MEDIFLOW_E2E_DISABLE_LEGACY_COPY=1 E2E_DISABLE_LEGACY_COPY=1
          npm run build
          node scripts/check-static-routes.mjs
          E2E_AUTH_RUNTIME="$(mktemp -d "${RUNNER_TEMP}/mediflow-auth-runtime.XXXXXX")"
          cp -R "${MEDIFLOW_NEXT_DIST_DIR}/standalone/." "${E2E_AUTH_RUNTIME}/"
          mkdir -p "${E2E_AUTH_RUNTIME}/public" "${E2E_AUTH_RUNTIME}/${MEDIFLOW_NEXT_DIST_DIR}/static"
          cp -R public/. "${E2E_AUTH_RUNTIME}/public/"
          cp -R "${MEDIFLOW_NEXT_DIST_DIR}/static/." "${E2E_AUTH_RUNTIME}/${MEDIFLOW_NEXT_DIST_DIR}/static/"
          printf 'E2E_ISOLATED_STANDALONE_DIR=%s\n' "${E2E_AUTH_RUNTIME}" >> "$GITHUB_ENV"
          node --input-type=module - "${E2E_AUTH_RUNTIME}/mediflow-build-identity.json" >> "$GITHUB_ENV" <<'NODE'
          import fs from 'node:fs';
          const identity = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const [key, value] of Object.entries({
            MEDIFLOW_APP_REVISION: identity.revision.slice(0, 12),
            MEDIFLOW_APP_BRANCH: identity.branch, MEDIFLOW_APP_WORKTREE_HASH: identity.worktreeHash,
            MEDIFLOW_APP_SOURCE_FINGERPRINT: identity.sourceFingerprint,
            MEDIFLOW_APP_FINGERPRINT: identity.sourceFingerprint,
          })) console.log(`${key}=${value}`);
          NODE
      - name: Run the direct and Dossier gestures against isolated synthetic runtimes
        env:
          E2E_BASE_URL: http://127.0.0.1:3123
          E2E_PIN: "1234"
        run: |
          MEDIFLOW_DATA_DIR="$(mktemp -d "${RUNNER_TEMP}/mediflow-dossier-data.XXXXXX")"
          export MEDIFLOW_DATA_DIR MEDIFLOW_E2E_DATA_DIR="$MEDIFLOW_DATA_DIR"
          export MEDIFLOW_E2E_DISABLE_LEGACY_COPY=1 E2E_DISABLE_LEGACY_COPY=1
          printf 'Synthetic legacy Dossier E2E\n' > "$MEDIFLOW_DATA_DIR/SYNTHETIC_ONLY"
          node scripts/prepare-e2e-db.mjs
          (cd "$E2E_ISOLATED_STANDALONE_DIR" && NODE_ENV=production HOSTNAME=127.0.0.1 PORT=3123 exec node server.js) > "$RUNNER_TEMP/dossier-server.log" 2>&1 &
          dossier_server_pid=$!
          trap 'kill "$dossier_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS "$E2E_BASE_URL/api/auth/check" > /dev/null; then break; fi
            kill -0 "$dossier_server_pid"
            sleep 1
          done
          curl -fsS "$E2E_BASE_URL/api/auth/check" > /dev/null
          CI= npm run test:e2e -- e2e/dossier-import.spec.ts e2e/patient-document-create.spec.ts --grep 'Dossier: cartella sintetica|Dossier senza CF|data di nascita esatta|nuova scheda da documento: revisione|nuova scheda senza identificativo|risposta persa|annullamento' --reporter=list,html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-document-identity-${{ matrix.proof.verdict }}-chrome
          path: |
            ${{ runner.temp }}/dossier-server.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
