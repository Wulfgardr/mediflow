name: Web Core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/native/MediFlowMac/Tests/MediFlowCoreTests/Fixtures/medical_fixture.db
      - name: Verify sparse production source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test ! -e native/MediFlowMac/Tests/MediFlowCoreTests/Fixtures/medical_fixture.db
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # test:unit uses the strip-types/registerHooks runner; Node 20 is not enough for this gate.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch frozen capability mapping sources
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(readFileSync('docs/capability-mapping/source-manifest.v1.json', 'utf8'));
          const commits = [...new Set(manifest.sources.map(source => source.commit))];
          if (!commits.length || commits.some(commit => typeof commit !== 'string' || !/^[0-9a-f]{40}$/.test(commit))) {
            throw new Error('Frozen capability source commits must be exact SHA-1 object IDs');
          }
          execFileSync('git', ['fetch', '--no-tags', 'origin', ...commits], { stdio: 'inherit' });
          for (const commit of commits) execFileSync('git', ['cat-file', '-e', `${commit}^{commit}`]);
          NODE
      - name: Therapy status finite model and controller traces
        timeout-minutes: 10
        env:
          MEDIFLOW_FORMAL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify:therapy-status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:type-scale
      - run: npm run check:lume-tokens
      - run: npm run test:lume-tokens
      - run: npm run check:motion-budget
      # @Codex: component tests in test:unit launch Chromium as well as Node.
      - name: Install Chromium for component tests
        run: npx playwright install --with-deps chromium
      - name: Allocate synthetic test data directory
        run: |
          DATA_DIR="$(mktemp -d "${RUNNER_TEMP}/mediflow-web-core.XXXXXX")"
          export MEDIFLOW_DATA_DIR="${DATA_DIR}"
          export MEDIFLOW_WEB_CORE_DATA_DIR="${DATA_DIR}"
          {
            printf 'MEDIFLOW_DATA_DIR=%s\n' "${DATA_DIR}"
            printf 'MEDIFLOW_WEB_CORE_DATA_DIR=%s\n' "${DATA_DIR}"
          } >> "${GITHUB_ENV}"
      - run: npm run test:unit
      - name: Historical schema origins converge to the fresh schema
        run: |
          node scripts/probe-historical-sql-baselines.mjs > "$RUNNER_TEMP/schema-convergence.json" \
            || { cat "$RUNNER_TEMP/schema-convergence.json"; exit 1; }
      - name: Clinical HTTP synthetic harnesses
        timeout-minutes: 20
        run: npm run test:clinical-http
      - name: Owned synthetic HTTP contracts
        run: npm run test:owned-http
      - name: Owned standalone supervisor contract
        run: npm run test:owned-http-standalone
      - name: Portable synthetic recipes
        run: npm run test:portable-local
      - name: Synthetic fixture generators
        run: npm run test:fixture-generators
      - name: Rust boundary contract and comparator
        run: npm run test:research-boundary
      - name: Cleanup synthetic test data directory
        if: always()
        run: |
          case "${MEDIFLOW_WEB_CORE_DATA_DIR:-}" in
            '') exit 0 ;;
            "${RUNNER_TEMP}"/mediflow-web-core.*)
              rm -rf -- "${MEDIFLOW_WEB_CORE_DATA_DIR}"
              ;;
            *)
              printf 'Refusing to clean an unexpected test data directory: %s\n' "${MEDIFLOW_WEB_CORE_DATA_DIR}" >&2
              exit 1
              ;;
          esac
