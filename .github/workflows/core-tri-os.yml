name: Core tri-OS gate

# ADR 0071 "Punto di non ritorno": the platform-free MediFlowCore must build and
# pass the byte-exact zero-knowledge crypto golden-vector gate on Linux and
# Windows. Apple Native owns the macOS coverage through its full SwiftPM suite.
# This cross-OS gate confirms the Swift-core direction: if the Swift toolchain on
# Windows/Linux ever diverges on AES-GCM/PBKDF2 (swift-crypto), this fails and we
# reconsider a Rust core (the golden vectors are language-neutral and already in
# hand). On non-Apple OSes the package manifest excludes the SwiftUI targets, so
# only MediFlowCore + MediFlowCoreTests compile here.
#
# WUL-544 — path filter spostato da `on:` ai job, stessa ragione di
# apple-native.yml: un workflow non partito lascia il check ASSENTE (PR bloccata
# in "Expected"), un job skippato emette un check run che vale come passato.
# Il check da rendere required è `core-tri-os` (job `gate`), non `linux`/`windows`.
#
# @Codex H9: questa configurazione aggiunge i gate cross-platform, ma non è
# evidenza di una loro esecuzione remota sullo stesso SHA. Il claim resta
# `HOLD_TRI_OS_CI_SAME_SHA` finché quella receipt non esiste.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: core-tri-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    # Nome distinto da quello di apple-native.yml: due check run omonimi sullo
    # stesso commit sono ambigui, e lo diventerebbero in branch protection.
    name: core-tri-os-changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Quali percorsi tocca questo evento
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail

          rc=0
          : > changed.txt
          case "$EVENT" in
            pull_request | pull_request_target)
              gh api --paginate "repos/$REPO/pulls/$PR/files" \
                --jq '.[].filename' > changed.txt || rc=1
              # Simmetrico alla guardia sui 300 del ramo push: anche questo endpoint
              # ha un tetto (3000 file), e una lista troncata in silenzio produrrebbe
              # un `core=false` per non aver visto.
              if [ "$rc" -eq 0 ] && [ "$(wc -l < changed.txt)" -ge 3000 ]; then
                echo "elenco file della PR potenzialmente troncato ($(wc -l < changed.txt))"
                rc=1
              fi
              ;;
            push)
              case "$BEFORE" in
                '' | 0000000000000000000000000000000000000000)
                  echo "push senza commit precedente utilizzabile (BEFORE=$BEFORE)"
                  rc=1
                  ;;
                *)
                  if gh api "repos/$REPO/compare/$BEFORE...$AFTER" > cmp.json; then
                    n="$(jq '.files | length' cmp.json)"
                    if [ "$n" -ge 300 ]; then
                      echo "diff troncato dall'API ($n file)"
                      rc=1
                    else
                      jq -r '.files[].filename' cmp.json > changed.txt
                    fi
                  else
                    echo "compare fallito (force-push? commit irraggiungibile?)"
                    rc=1
                  fi
                  ;;
              esac
              ;;
            *)
              echo "evento '$EVENT': eseguo tutto"
              rc=1
              ;;
          esac

          if [ "$rc" -ne 0 ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "VERDETTO core=true (fail-open)"
            exit 0
          fi

          echo "--- file cambiati ($(wc -l < changed.txt)) ---"
          cat changed.txt

          # Anche qui il blocco `on: push:` era più stretto di `on: pull_request:`
          # (solo MediFlowCore/** e contracts/**). Asimmetria preservata.
          core=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              native/MediFlowMac/Sources/MediFlowCore/*) core=true; continue ;;
              native/contracts/*)                        core=true; continue ;;
              # @Codex
              scripts/generate-headless-soap-entry-h4-golden.mjs) core=true; continue ;;
              scripts/generate-headless-soap-entry-contract-golden.ts) core=true; continue ;;
              scripts/run-strip-types.mjs) core=true; continue ;;
              scripts/register-strip-types-loader.mjs) core=true; continue ;;
              lib/headless/clinician-soap-write-contract.ts) core=true; continue ;;
              lib/headless/clinician-soap-write-contract.test.ts) core=true; continue ;;
              lib/headless/clinician-soap-entry-commit-receipt.ts) core=true; continue ;;
              lib/headless/clinician-soap-entry-commit-receipt.test.ts) core=true; continue ;;
              package.json | package-lock.json) core=true; continue ;;
            esac
            if [ "$EVENT" != push ]; then
              case "$f" in
                native/MediFlowMac/Tests/MediFlowCoreTests/*) core=true ;;
                native/MediFlowMac/Package.swift)             core=true ;;
                .github/workflows/core-tri-os.yml)            core=true ;;
              esac
            fi
          done < changed.txt

          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "VERDETTO core=$core"

  linux:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build MediFlowCore (manifest excludes Apple targets off-Apple)
        run: swift build --package-path native/MediFlowMac --target MediFlowCore
      - name: Golden-vector gate (MediFlowCoreTests)
        run: swift test --package-path native/MediFlowMac --filter CryptoGoldenVectorsTests
      - name: H4 SOAP field-set and seal golden gate
        run: swift test --package-path native/MediFlowMac --filter HeadlessSoapEntryH4GoldenTests
      - name: H9 SOAP draft and receipt contract golden gate
        run: swift test --package-path native/MediFlowMac --filter HeadlessSoapEntryContractGoldenTests

  # @Codex
  h4-golden:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install golden codec dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: H4 golden fixture drift check
        run: node scripts/generate-headless-soap-entry-h4-golden.mjs --check
      - name: H9 golden fixture drift check
        run: node scripts/run-strip-types.mjs scripts/generate-headless-soap-entry-contract-golden.ts --check
      - name: H9 TypeScript draft and receipt contract tests
        run: >-
          node scripts/run-strip-types.mjs --test
          lib/headless/clinician-soap-write-contract.test.ts
          lib/headless/clinician-soap-entry-commit-receipt.test.ts

  windows:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.4.0
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Select supported Windows SDK
        uses: compnerd/gha-setup-vsdevenv@v6
        with:
          winsdk: 10.0.26100.0
      - name: Swift version
        run: swift --version
        shell: pwsh
      - name: Build MediFlowCore
        run: swift build --package-path native/MediFlowMac --target MediFlowCore
        shell: pwsh
      - name: Golden-vector gate (MediFlowCoreTests)
        run: swift test --package-path native/MediFlowMac --filter CryptoGoldenVectorsTests
        shell: pwsh
      - name: H4 SOAP field-set and seal golden gate
        run: swift test --package-path native/MediFlowMac --filter HeadlessSoapEntryH4GoldenTests
        shell: pwsh
      - name: H9 SOAP draft and receipt contract golden gate
        run: swift test --package-path native/MediFlowMac --filter HeadlessSoapEntryContractGoldenTests
        shell: pwsh

  # Contesto da rendere required: `core-tri-os`.
  gate:
    name: core-tri-os
    needs: [changes, h4-golden, linux, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verdetto
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail

          if [ -z "${NEEDS:-}" ] || [ "$NEEDS" = "null" ] || [ "$NEEDS" = "{}" ]; then
            echo "FAIL: contesto needs vuoto — il gate non sta osservando nulla."
            exit 1
          fi

          fail=0
          n=0
          while IFS='=' read -r name res; do
            n=$((n + 1))
            case "$res" in
              success | skipped)
                printf 'OK    %-22s %s\n' "$name" "$res"
                ;;
              *)
                printf 'FAIL  %-22s %s\n' "$name" "${res:-<vuoto>}"
                fail=1
                ;;
            esac
          done < <(echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result // "")"')

          if [ "$n" -eq 0 ]; then
            echo "FAIL: nessun job osservato."
            exit 1
          fi

          echo "--- $n job osservati, esito gate: $([ $fail -eq 0 ] && echo success || echo failure)"
          exit $fail
