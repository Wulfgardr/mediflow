name: Release development usage
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release-usage:
    runs-on: ubuntu-latest
    env:
      MEDIFLOW_RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm run check:release-usage
          npm run check:usage-dashboard
          npm run test:usage-dashboard
          npm run test:release-usage
