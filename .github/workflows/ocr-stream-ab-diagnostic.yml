name: OCR fetch terminal diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/ocr-stream-ab-diagnostic.yml
      - e2e/ocr-fetch-terminal.diagnostic.mjs

permissions:
  contents: read

concurrency:
  group: ocr-fetch-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install fixed Playwright Chromium from lockfile
        run: npx playwright install --with-deps chromium
      - name: Run ten synthetic fetch observations
        run: node e2e/ocr-fetch-terminal.diagnostic.mjs
      - name: Upload sanitized diagnostic metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-fetch-terminal-diagnostic
          path: ocr-fetch-terminal-sanitized.json
          if-no-files-found: warn
          retention-days: 7
