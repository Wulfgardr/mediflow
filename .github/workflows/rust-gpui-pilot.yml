name: Rust GPUI connected client

on:
  pull_request:
    paths:
      - 'native/MediFlowMac/Sources/MediFlowCore/VisitRecordingStateContract.swift'
      - 'native/MediFlowMac/Sources/MediFlowAppleShared/VisitRecording*.swift'
      - 'native/MediFlowMac/Sources/MediFlowAppleShared/AppleVisitRecordingRuntime.swift'
      - 'experiments/gpui-patient-pilot/**'
      - 'app/fonts/**'
      - 'native/MediFlowMac/Sources/MediFlowAppleShared/Resources/Fonts/**'
      - 'docs/design/punto-inchiostro/tokens/punto-inchiostro.tokens.json'
      - 'docs/design/lume/tokens/lume.tokens.json'
      - 'public/brand/mediflow/*.svg'
      - 'native/contracts/crypto-golden-vectors.v3.json'
      - 'native/contracts/recovery-backup-golden.v1.json'
      - 'app/api/**'
      - 'lib/**'
      - 'drizzle/**'
      - 'packages/web-auth-lifecycle-owner/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-e2e-db.mjs'
      - 'scripts/web-auth-control-test-client.mjs'
      - 'scripts/chat-card-*.mjs'
      - 'scripts/*chat-therapy*'
      - 'scripts/fixtures/chat-card-owned-tree.mjs'
      - 'scripts/native-tool-test-selection.mjs'
      - 'scripts/probe-patient-document-key-erasure.mjs'
      - 'scripts/check-test-selection.test.mjs'
      - '.github/workflows/rust-gpui-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'native/MediFlowMac/Sources/MediFlowCore/VisitRecordingStateContract.swift'
      - 'native/MediFlowMac/Sources/MediFlowAppleShared/VisitRecording*.swift'
      - 'native/MediFlowMac/Sources/MediFlowAppleShared/AppleVisitRecordingRuntime.swift'
      - 'experiments/gpui-patient-pilot/**'
      - 'app/fonts/**'
      - 'native/MediFlowMac/Sources/MediFlowAppleShared/Resources/Fonts/**'
      - 'docs/design/punto-inchiostro/tokens/punto-inchiostro.tokens.json'
      - 'docs/design/lume/tokens/lume.tokens.json'
      - 'public/brand/mediflow/*.svg'
      - 'native/contracts/crypto-golden-vectors.v3.json'
      - 'native/contracts/recovery-backup-golden.v1.json'
      - 'app/api/**'
      - 'lib/**'
      - 'drizzle/**'
      - 'packages/web-auth-lifecycle-owner/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-e2e-db.mjs'
      - 'scripts/web-auth-control-test-client.mjs'
      - 'scripts/chat-card-*.mjs'
      - 'scripts/*chat-therapy*'
      - 'scripts/fixtures/chat-card-owned-tree.mjs'
      - 'scripts/native-tool-test-selection.mjs'
      - 'scripts/probe-patient-document-key-erasure.mjs'
      - 'scripts/check-test-selection.test.mjs'
      - '.github/workflows/rust-gpui-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-gpui-pilot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native-tests:
    name: Rust GPUI client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node for owned process regression tests
        if: runner.os != 'Windows'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444b # v5
        with:
          node-version: '24.18.0'
      - name: Install source-pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install Linux GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang pkg-config libfontconfig-dev libglib2.0-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - name: Ensure macOS Metal compiler is available
        if: runner.os == 'macOS'
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Check workspace formatting
        run: cargo fmt --manifest-path experiments/gpui-patient-pilot/Cargo.toml --all --check
      - name: Test bundle staging guards and manifest inventory
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s experiments/gpui-patient-pilot/scripts -p 'test_bundle_macos.py'
      - name: Check native targets with Clippy
        run: cargo clippy --manifest-path experiments/gpui-patient-pilot/Cargo.toml --workspace --all-targets --locked -- -Dwarnings
      # Cargo compiles every native target and runs pure synthetic tests. These
      # checks do not exercise a window, input methods, accessibility or GPU UI.
      - name: Compile all native targets and run synthetic tests
        run: cargo test --manifest-path experiments/gpui-patient-pilot/Cargo.toml --workspace --all-targets --locked
      - name: Build and launch the source-identified macOS package
        if: runner.os == 'macOS'
        run: |
          python3 experiments/gpui-patient-pilot/scripts/bundle_macos.py --staging "$RUNNER_TEMP/gpui-bundle" --target-dir "$RUNNER_TEMP/gpui-release"
          "$RUNNER_TEMP/gpui-bundle/MediFlow GPUI.app/Contents/MacOS/mediflow-gpui-patient-pilot" --verify-bundled-assets
      - name: Build the optimized patient document memory probe
        if: runner.os == 'Linux'
        run: cargo rustc --manifest-path experiments/gpui-patient-pilot/Cargo.toml -p mediflow-runtime-client --example patient_document_key_erasure --locked -- -C opt-level=2
      - name: Check file key erasure on a 5 MiB denied upload
        if: runner.os == 'Linux'
        run: node scripts/probe-patient-document-key-erasure.mjs experiments/gpui-patient-pilot/target/debug/examples/patient_document_key_erasure key-erasure-ci --ci
      - name: Install real route dependencies for withdrawal regression
        if: runner.os == 'macOS'
        run: npm ci && npm run prepare:dependencies
      - name: Withdraw during real PIN verification and reconcile failures
        if: runner.os == 'macOS'
        run: node scripts/check-chat-therapy-withdraw.mjs

  runtime-comparison:
    name: Existing JavaScript vs Rust on a synthetic runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install the locked current runtime
        run: npm ci && npm run prepare:dependencies
      - name: Install source-pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check governance fixtures against host builders and report storage
        run: node --import ./scripts/register-strip-types-loader.mjs experiments/gpui-patient-pilot/comparison/governance.mjs --check
      - name: Build the optimized paired client probe
        run: cargo build --manifest-path experiments/gpui-patient-pilot/Cargo.toml -p mediflow-runtime-client --bin mediflow-runtime-probe --locked --release
      - name: Compare decrypted reads, guarded writes and diagnostic timings
        run: node experiments/gpui-patient-pilot/comparison/run.mjs --rust-probe experiments/gpui-patient-pilot/target/release/mediflow-runtime-probe --output-dir comparison-results --samples 5
      - name: Retain public synthetic comparison receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-javascript-comparison
          path: comparison-results/
          if-no-files-found: error
