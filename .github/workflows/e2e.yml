name: E2E (Playwright)

# Playwright end-to-end smoke for the local-first web app. Boots a seeded, ephemeral
# Next.js standalone production server against a throwaway SQLite DB and runs the e2e/*.spec.ts suite.
# The destructive auth lifecycle test starts its own production process and empty DB.
#
# Node 24: npm ci rebuilds the native better-sqlite3 binding against the Node 24 ABI,
# so the server can open the SQLite database. The web-core.yml gate also runs on Node 24.
#
# Hermetic: every run seeds a unique temp data dir (MEDIFLOW_DATA_DIR) and a dedicated
# Next dist dir (MEDIFLOW_NEXT_DIST_DIR=.next-e2e); nothing depends on a checked-in
# medical.db or on developer state.
#
# Every spec still runs. Only exact failures in e2e/quarantine.json are temporarily
# non-blocking; raw failures and expiry decisions remain in the uploaded reports.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://127.0.0.1:3123
      E2E_PIN: "1234"
      MEDIFLOW_NEXT_DIST_DIR: .next-e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/native/MediFlowMac/Tests/MediFlowCoreTests/Fixtures/medical_fixture.db
      - name: Verify sparse production source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test ! -e native/MediFlowMac/Tests/MediFlowCoreTests/Fixtures/medical_fixture.db

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # npm ci rebuilds better-sqlite3 for the Node 24 ABI so the server can boot.
      - run: npm ci

      - name: Test AnyDoc diagnostic artifact boundary
        run: npm run test:anydoc-diagnostics

      - name: Read locked Playwright version
        id: playwright_version
        run: node -e 'const fs = require("node:fs"); const version = require("./package-lock.json").packages["node_modules/@playwright/test"].version; if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Invalid locked Playwright version"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'

      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright system dependencies
        run: npx --no-install playwright install-deps chromium

      - name: Install Playwright chromium
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install chromium

      - name: Verify locked Chromium identity
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { chromium } from '@playwright/test';
          const require = createRequire(import.meta.url);
          const expected = require(require.resolve('playwright-core/package.json').replace(/package\.json$/, 'browsers.json')).browsers.find(browser => browser.name === 'chromium').browserVersion;
          const browser = await chromium.launch();
          try {
            const actual = browser.version();
            console.log(JSON.stringify({ playwright: require('@playwright/test/package.json').version, executable: chromium.executablePath(), expected, actual }));
            if (actual !== expected) throw new Error('Chromium version differs from locked Playwright');
          } finally { await browser.close(); }
          NODE

      # @Codex: build once, then keep an immutable copy outside the dev dist directory.
      # The reset test must never reset the suite's shared account or database.
      - name: Prepare standalone bundle for isolated auth lifecycle
        run: |
          test -z "$(git status --porcelain)"
          export MEDIFLOW_APP_REVISION="$(git rev-parse --short=12 HEAD)"
          export MEDIFLOW_APP_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          export MEDIFLOW_APP_WORKTREE_HASH=clean
          unset MEDIFLOW_APP_SOURCE_FINGERPRINT MEDIFLOW_APP_FINGERPRINT
          unset E2E_BASE_URL E2E_PIN MEDIFLOW_RUNTIME_TWIN NEXT_PUBLIC_MEDIFLOW_RUNTIME_TWIN
          # Build-time storage is separate from both runtime fixtures and never reused.
          E2E_BUILD_DATA="$(mktemp -d "${RUNNER_TEMP}/mediflow-build-data.XXXXXX")"
          export MEDIFLOW_DATA_DIR="${E2E_BUILD_DATA}"
          export MEDIFLOW_E2E_DATA_DIR="${E2E_BUILD_DATA}"
          export MEDIFLOW_E2E_DISABLE_LEGACY_COPY=1 E2E_DISABLE_LEGACY_COPY=1
          npm run build
          node scripts/check-static-routes.mjs
          E2E_AUTH_RUNTIME="$(mktemp -d "${RUNNER_TEMP}/mediflow-auth-runtime.XXXXXX")"
          cp -R "${MEDIFLOW_NEXT_DIST_DIR}/standalone/." "${E2E_AUTH_RUNTIME}/"
          mkdir -p "${E2E_AUTH_RUNTIME}/public" "${E2E_AUTH_RUNTIME}/${MEDIFLOW_NEXT_DIST_DIR}/static"
          cp -R public/. "${E2E_AUTH_RUNTIME}/public/"
          cp -R "${MEDIFLOW_NEXT_DIST_DIR}/static/." "${E2E_AUTH_RUNTIME}/${MEDIFLOW_NEXT_DIST_DIR}/static/"
          printf 'E2E_ISOLATED_STANDALONE_DIR=%s\n' "${E2E_AUTH_RUNTIME}" >> "$GITHUB_ENV"
          node --input-type=module - "${E2E_AUTH_RUNTIME}/mediflow-build-identity.json" >> "$GITHUB_ENV" <<'NODE'
          import fs from 'node:fs';
          const identity = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const [key, value] of Object.entries({
            MEDIFLOW_APP_REVISION: identity.revision.slice(0, 12),
            MEDIFLOW_APP_BRANCH: identity.branch, MEDIFLOW_APP_WORKTREE_HASH: identity.worktreeHash,
            MEDIFLOW_APP_SOURCE_FINGERPRINT: identity.sourceFingerprint,
            MEDIFLOW_APP_FINGERPRINT: identity.sourceFingerprint,
          })) console.log(`${key}=${value}`);
          NODE

      - name: Seed ephemeral e2e database
        run: |
          # @Codex: satisfy the canonical synthetic-fixture preconditions before seeding.
          E2E_DATA_DIR="$(node -e 'const fs = require("node:fs"), os = require("node:os"), path = require("node:path"); process.stdout.write(fs.mkdtempSync(path.join(os.tmpdir(), "mediflow-e2e-")))')"
          export MEDIFLOW_DATA_DIR="${E2E_DATA_DIR}"
          export MEDIFLOW_E2E_DATA_DIR="${E2E_DATA_DIR}"
          export MEDIFLOW_E2E_DISABLE_LEGACY_COPY=1 E2E_DISABLE_LEGACY_COPY=1
          printf '%s\n' 'Synthetic E2E fixture; WHO local sidecar transport is simulated.' > "${E2E_DATA_DIR}/SYNTHETIC_ONLY"
          {
            printf 'MEDIFLOW_DATA_DIR=%s\n' "${E2E_DATA_DIR}"
            printf 'MEDIFLOW_E2E_DATA_DIR=%s\n' "${E2E_DATA_DIR}"
            printf 'MEDIFLOW_E2E_DISABLE_LEGACY_COPY=1\n'
            printf 'E2E_DISABLE_LEGACY_COPY=1\n'
          } >> "$GITHUB_ENV"
          node scripts/prepare-e2e-db.mjs

      # @Codex: run the same traced production bundle prepared above. The seeded
      # synthetic directory and explicit feature guards remain inherited from GITHUB_ENV.
      - name: Start Next.js standalone server
        run: |
          cd "${E2E_ISOLATED_STANDALONE_DIR}"
          NODE_ENV=production HOSTNAME=127.0.0.1 PORT=3123 MEDIFLOW_ANYDOC_HTTP_DIAGNOSTIC=1 \
            node --require "${GITHUB_WORKSPACE}/scripts/anydoc-http-diagnostic.cjs" server.js > "${RUNNER_TEMP}/next-standalone.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/next-standalone.pid"

      - name: Wait for server readiness
        run: |
          for i in $(seq 1 180); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3123/api/auth/check || echo 000)"
            if [ "$code" = "200" ]; then
              echo "Server ready after ${i}s (auth/check -> ${code})."
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/next-standalone.pid")" 2>/dev/null; then
              echo "Standalone server exited before readiness."
              cat "${RUNNER_TEMP}/next-standalone.log"
              exit 1
            fi
            sleep 1
          done
          echo "Server did not become ready in time."
          tail -50 "${RUNNER_TEMP}/next-standalone.log"
          exit 1

      - name: Run Playwright suite
        # @Codex: the preceding steps seed and start an isolated synthetic DB.
        env:
          MF085_SYNTHETIC_E2E: "1"
          MEDIFLOW_ANYDOC_HTTP_DIAGNOSTIC: "1"
          # @Codex: document-flow-real-route owns an empty standalone runtime and
          # runs only when this explicit synthetic-fixture opt-in is present.
          E2E_DOCUMENTS_SYNTHETIC_ONLY: "1"
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Official UI production acceptance
        env:
          E2E_BASE_URL: http://127.0.0.1:3252
          MEDIFLOW_TEST_OFFICIAL_UI: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/official-ui
        run: |
          export MEDIFLOW_DATA_DIR="$(mktemp -d /tmp/mf-official.XXXXXX)"
          export MEDIFLOW_E2E_DATA_DIR="$MEDIFLOW_DATA_DIR"
          export MEDIFLOW_E2E_DISABLE_LEGACY_COPY=1 E2E_DISABLE_LEGACY_COPY=1
          printf 'Synthetic official UI acceptance fixture\n' > "$MEDIFLOW_DATA_DIR/SYNTHETIC-PROTOTYPE"
          node scripts/prepare-e2e-db.mjs
          (cd "$E2E_ISOLATED_STANDALONE_DIR" && NODE_ENV=production HOSTNAME=127.0.0.1 PORT=3252 node server.js) > "$RUNNER_TEMP/official-ui.log" 2>&1 &
          OFFICIAL_UI_PID=$!
          trap 'kill "$OFFICIAL_UI_PID"; wait "$OFFICIAL_UI_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL/api/auth/check" > /dev/null; then break; fi
            kill -0 "$OFFICIAL_UI_PID" || { cat "$RUNNER_TEMP/official-ui.log"; exit 1; }
            sleep 1
          done
          curl -fsS "$E2E_BASE_URL/api/auth/check" > /dev/null
          # Keep the main suite quarantine report; these six cases have no exemptions.
          npm run test:e2e -- e2e/official-ui.spec.ts --retries=0 --reporter=list,html --output=test-results/official-ui

      - name: Synthetic component browser contracts
        run: npm run test:inventory-browser

      # This browser harness uses node:test and top-level await, so it is not
      # collectable by Playwright. Keep it in its canonical runner with an
      # independent marked synthetic directory.
      - name: Run ChatGPT product browser harness
        run: |
          CHATGPT_PRODUCT_DATA_DIR="$(mktemp -d "${RUNNER_TEMP}/mediflow-chatgpt-product.XXXXXX")"
          MEDIFLOW_DATA_DIR="${CHATGPT_PRODUCT_DATA_DIR}" \
            node scripts/chatgpt-product-focused-tests.mjs --browser-only

      # Seconda fase di `npm run check:terminology-parity`, l'unica che non
      # girava da nessuna parte. Avvia un proprio Next dev su 127.0.0.1:3200 in
      # un workspace effimero, quindi non tocca il server e2e sulla 3123. Sta
      # qui e non in Repository Guards perché avviare un server è esattamente
      # ciò che questo workflow fa già, e Repository Guards deve restare
      # deterministico e veloce.
      # E2E_BASE_URL va riscritto per questo step: il job lo fissa a :3123 per
      # Playwright, ma lo smoke legge la stessa variabile per decidere su quale
      # porta avviare il PROPRIO server (`${E2E_BASE_URL:-…:3200}`). Ereditando
      # :3123 tenta di occupare una porta già presa e muore in attesa di
      # readiness. Il default dello script è 3200: qui va reso esplicito.
      - name: Lettura catalogo home-base, smoke paired e capability-gated
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
        run: npm run test:network:home-base-catalog-read

      - name: Stop Next.js standalone server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/next-standalone.pid" ]; then
            SERVER_PID="$(cat "${RUNNER_TEMP}/next-standalone.pid")"
            kill "${SERVER_PID}" 2>/dev/null || true
            # Let the existing application shutdown finish and seal the collector.
            # This is bounded teardown, not an extension of any test timeout.
            for i in $(seq 1 10); do
              if ! kill -0 "${SERVER_PID}" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "Standalone teardown incomplete; diagnostic collection may be unsealed."
              exit 1
            fi
          fi

      - name: Export AnyDoc diagnostic metadata
        id: anydoc_diagnostic_export
        if: always()
        run: node scripts/anydoc-http-diagnostic.cjs --export "${RUNNER_TEMP}/anydoc-http-diagnostic.jsonl"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AnyDoc diagnostic metadata
        if: always() && steps.anydoc_diagnostic_export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anydoc-http-diagnostic-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/anydoc-http-diagnostic.jsonl
          if-no-files-found: error
          retention-days: 7

  e2e:
    if: always()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$SHARD_RESULT" = success
