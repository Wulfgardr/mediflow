name: Repository Guards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Claims guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:claims
          npm run check:claims -- --self-test
      - name: Schema writer guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:schema-writers
          npm run check:schema-writers -- --self-test
      - name: AI clinical write guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:ai-clinical-writes
          npm run check:ai-clinical-writes -- --self-test
      - name: API error leak guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:api-error-leak
          npm run check:api-error-leak -- --self-test
      - name: Never-regress guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:never-regress

      # Puro fs.readFileSync su cinque file: nessuna rete, nessun DB, nessuna
      # toolchain, ~150 ms. È a contatori espliciti, quindi si romperà a ogni
      # aggiunta legittima di una capability — è il comportamento voluto, come
      # per check:lume-tokens, non un difetto da scoprire dopo.
      - name: Apple wide QA manifest guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:apple-wide-qa

      # Otto controlli di presenza che fissano il confine «MLX è benchmark-visible,
      # non runtime clinico». Non richiede MLX, né Ollama, né socket: ~150 ms.
      - name: MLX operational parity guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:mlx-operational-parity
      - name: Mini parity schema and source drift guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:mini-parity
          npm run test:mini-parity
      - name: OpenAPI contract guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:openapi:drift -- --base-ref origin/main
          npm run check:openapi:drift -- --self-test

      # WUL-547. Questi due gate non giravano in nessun workflow, e l'orfanità era
      # invisibile per una ragione precisa: entrambi hanno un unit test che invoca il
      # gate REALE (`check-schema-drift.test.ts:15` via spawnSync,
      # `audit-quality-gate.test.mjs:94` su fixture), quindi risultavano coperti a
      # chiunque contasse «il gate compare in test:unit». Ma quei test asseriscono il
      # comportamento del gate su fixture, non lo stato di QUESTO repo: sono due
      # domande diverse, e solo la seconda intercetta una deriva reale.
      - name: Schema drift guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:schema-drift
      - name: Audit quality gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:audit-quality-gate
