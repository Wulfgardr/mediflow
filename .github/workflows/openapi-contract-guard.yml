name: Repository Guards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reject Xcode per-user workspace state
        run: |
          tracked_user_state="$(git ls-files | grep -E '(^|/)xcuserdata/|\.xcuserstate$' || true)"
          if [[ -n "$tracked_user_state" ]]; then
            printf 'Xcode per-user state must not enter the source archive:\n%s\n' "$tracked_user_state" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci && npm run prepare:dependencies
      - name: Test selection check and negative fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:test-selection
          npm run check:test-selection
      - name: Claims guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:claims
          npm run check:claims -- --self-test
      - name: Public usage dashboard consistency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:usage-dashboard
          npm run check:usage-dashboard
      - name: Schema writer guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:schema-writers
          npm run check:schema-writers -- --self-test
      - name: AI clinical write guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:ai-clinical-writes
          npm run check:ai-clinical-writes -- --self-test
      - name: Runtime database import boundary and negative fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:database-import-boundary
          npm run test:database-import-boundary
      - name: API error leak guard and self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:api-error-leak
          npm run check:api-error-leak -- --self-test
      - name: Never-regress guard and HTML sink fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:never-regress
          node --test scripts/html-sink-guard.test.mjs
      - name: New comments ratchet and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:new-comments
          npm run check:new-comments
      - name: useEffect ratchet and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:use-effect-ratchet
          npm run check:use-effect-ratchet
      - name: Button system ratchet and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:button-system
          npm run check:button-system
      - name: Pairing state single-writer guard and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:pairing-state-writers
          npm run check:pairing-state-writers
      - name: Test fake-schema ratchet and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:test-fake-schema-ratchet
          npm run check:test-fake-schema-ratchet
      - name: Attachment currentness writer guard and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:attachment-currentness-writers
          npm run check:attachment-currentness-writers
      - name: AnyDoc local-only guard and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:anydoc-local-only
          npm run check:anydoc-local-only
      - name: CI guard wiring check and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:ci-guards-wired
          npm run check:ci-guards-wired
      - name: Public sanitization guard and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:public-sanitization
          npm run check:public-sanitization
      - name: Public sanitization guard on PR metadata and commits
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/check-public-sanitization.mjs --stdin --label pull-request-metadata
          git log --format='%B' "${BASE_SHA}..${HEAD_SHA}" | node scripts/check-public-sanitization.mjs --stdin --label pull-request-commits
      - name: Dossier conformance corpus drift guard and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:dossier-conformance-corpus
          npm run check:dossier-conformance-corpus

      - name: Fabric generative runtime crosswalk
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:fabric-generative-runtime-crosswalk
          npm run test:fabric-generative-runtime-crosswalk

      - name: Fabric operational catalog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:fabric-operational-catalog
          MEDIFLOW_DATA_DIR="$RUNNER_TEMP/fabric-catalog-test" npm run test:fabric-operational-catalog

      # Puro fs.readFileSync su cinque file: nessuna rete, nessun DB, nessuna
      # toolchain, ~150 ms. È a contatori espliciti, quindi si romperà a ogni
      # aggiunta legittima di una capability — è il comportamento voluto, come
      # per check:lume-tokens, non un difetto da scoprire dopo.
      - name: Apple wide QA manifest guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:apple-wide-qa

      - name: OpenAPI contract guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run check:openapi:drift -- --base-ref origin/main
          npm run check:openapi:drift -- --self-test

      # WUL-547. Questi due gate non giravano in nessun workflow, e l'orfanità era
      # invisibile per una ragione precisa: entrambi hanno un unit test che invoca il
      # gate REALE (`check-schema-drift.test.ts:15` via spawnSync,
      # `audit-quality-gate.test.mjs:94` su fixture), quindi risultavano coperti a
      # chiunque contasse «il gate compare in test:unit». Ma quei test asseriscono il
      # comportamento del gate su fixture, non lo stato di QUESTO repo: sono due
      # domande diverse, e solo la seconda intercetta una deriva reale.
      - name: Schema drift guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:schema-drift
      - name: Audit quality gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:audit-quality-gate

      - name: Local operation protocol notifications
        run: MEDIFLOW_DATA_DIR="$RUNNER_TEMP/local-operation-protocol" node scripts/run-strip-types.mjs --test packages/mcp/src/local-operation-protocol.test.ts
