# Local review proposal only. No workflow has been published or dispatched.
name: PR383 first Windows PDF render diagnostic
on:
  push:
    branches:
      - diagnostic/pr383-windows-first-cold-render-20261001
permissions:
  contents: read
concurrency:
  group: pr383-first-cold-pdf-render
  cancel-in-progress: false
jobs:
  diagnostic:
    name: first render observation (never a required gate)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the independently reviewed diagnostic branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: diagnostic-source
      - name: Check out the failed job's exact merge tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: eb701348f3a01ccf5051fe3d8a51de1082ef751d
          persist-credentials: false
          path: candidate
      - name: Use the observed supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Verify candidate, probe hashes and original lifecycle commands
        run: |
          New-Item -ItemType Directory -Force receipts | Out-Null
          $pdfSyntheticDirectory = Join-Path $env:RUNNER_TEMP 'mediflow-pr383-cold-synthetic'
          "MEDIFLOW_DATA_DIR=$pdfSyntheticDirectory" >> $env:GITHUB_ENV
          $pdfCandidateHead = git -C candidate rev-parse HEAD
          $pdfCandidateTree = git -C candidate rev-parse 'HEAD^{tree}'
          $pdfCandidateParents = node -e "const {execFileSync}=require('node:child_process'); const headers=execFileSync('git',['-C','candidate','cat-file','-p','HEAD'],{encoding:'utf8'}).split(/\r?\n\r?\n/,1)[0]; console.log(headers.split(/\r?\n/).filter(line=>/^parent [0-9a-f]{40}$/.test(line)).map(line=>line.slice(7)).join(' '));"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate commit parents' }
          if ($pdfCandidateHead -ne 'eb701348f3a01ccf5051fe3d8a51de1082ef751d' -or $pdfCandidateTree -ne '1deddabbdf1dd2282ea8f63a05c89fd69e6483bc' -or $pdfCandidateParents -ne 'a238b47fccce09db9a0a7b3977355266962216ca df90702a69c8877557d666be81d039d6f88cde7a') { throw 'Candidate identity mismatch' }
          $pdfExpectedHashes = @{
            'pdf-phase-preload.mjs' = '3ee154b1832b6c2ffea51ffd82efdeab06312f094a5d5e09b910965d4349cdec'
            'pdf-phase-records.mjs' = 'fbdfd30256a581d2650139b7695f54688f0a948a8efa5ddf8b8345091cee4460'
            'cold-render-observer.mjs' = '89e49d2ba9b70d51971297b5cfea91fd6057e78069fcc024fa100d9bf9899954'
            'checker-cold-preload.mjs' = 'f2856383e993caf2f0c15433d8b2842f654e62da0353d4a5c8f851788a0ecbe6'
            'run-pdf-phase-probe.mjs' = '0b86e1243f7916e6b358127845aee077b1e5b1abdd2c842f6d91f692eefc111a'
          }
          foreach ($pdfName in $pdfExpectedHashes.Keys) {
            $pdfActual = (Get-FileHash "diagnostic-source/.diagnostics/cold-pdf/$pdfName" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($pdfActual -ne $pdfExpectedHashes[$pdfName]) { throw 'Reviewed diagnostic hash mismatch' }
          }
          $pdfPackage = Get-Content -Raw candidate/package.json | ConvertFrom-Json
          if ($pdfPackage.scripts.prebuild -ne 'node scripts/node-runtime-contract.mjs verify' -or $pdfPackage.scripts.build -ne 'next build' -or $pdfPackage.scripts.postbuild -ne 'node scripts/node-runtime-contract.mjs write-standalone-manifest && node scripts/check-standalone-runtime-bundle.mjs') { throw 'Original lifecycle changed' }
          @{ candidateHead = $pdfCandidateHead; candidateTree = $pdfCandidateTree; candidateParents = $pdfCandidateParents; probeHashes = $pdfExpectedHashes; imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; qualification = 'diagnostic only; first checker render; cannot replace required CI' } | ConvertTo-Json -Depth 4 | Set-Content receipts/identity.json
      - name: Install the exact lockfile without browser downloads
        working-directory: candidate
        run: |
          npm ci
          exit $LASTEXITCODE
      - name: Run original prebuild then compile once before any PDF postbuild render
        working-directory: candidate
        run: |
          npm run prebuild
          $pdfPrebuildExit = $LASTEXITCODE
          @{ exitCode = $pdfPrebuildExit } | ConvertTo-Json | Set-Content ../receipts/prebuild-exit.json
          if ($pdfPrebuildExit -ne 0) { exit $pdfPrebuildExit }
          # Execute the unchanged "next build" script; lifecycle hooks run explicitly.
          npm --ignore-scripts run build
          $pdfCompileExit = $LASTEXITCODE
          @{ exitCode = $pdfCompileExit } | ConvertTo-Json | Set-Content ../receipts/compile-exit.json
          exit $pdfCompileExit
      - name: Write the original standalone runtime manifest
        working-directory: candidate
        run: |
          node scripts/node-runtime-contract.mjs write-standalone-manifest
          $pdfManifestExit = $LASTEXITCODE
          @{ exitCode = $pdfManifestExit } | ConvertTo-Json | Set-Content ../receipts/manifest-exit.json
          exit $pdfManifestExit
      - name: Observe the first full checker render and retain its original failure
        working-directory: candidate
        run: |
          $pdfReceiptPath = Join-Path (Resolve-Path ../receipts).Path 'cold-render.json'
          $env:MEDIFLOW_PDF_COLD_RECEIPT = $pdfReceiptPath
          $pdfOS = Get-CimInstance Win32_OperatingSystem
          @{ physicalFreeKiB = $pdfOS.FreePhysicalMemory; physicalTotalKiB = $pdfOS.TotalVisibleMemorySize } | ConvertTo-Json | Set-Content ../receipts/pre-render-memory.json
          node --import ../diagnostic-source/.diagnostics/cold-pdf/checker-cold-preload.mjs scripts/check-standalone-runtime-bundle.mjs
          $pdfCheckerExit = $LASTEXITCODE
          @{ exitCode = $pdfCheckerExit; qualification = 'always nonqualifying; raw probe stderr intentionally rejects original smoke' } | ConvertTo-Json | Set-Content ../receipts/checker-exit.json
          exit $pdfCheckerExit
      - name: Retain only small sanitized synthetic receipts even after failure
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr383-first-cold-render-diagnostic
          path: receipts/*.json
          retention-days: 3
          if-no-files-found: error
