name: WUL-787 Linux diagnostics

on:
  push:
    branches: [codex/WUL-787-linux-diagnostics-20261024]

permissions:
  contents: read

concurrency:
  group: wul-787-linux-diagnostics-20261024
  cancel-in-progress: false

jobs:
  native-diagnostics:
    name: WUL-787 native diagnostic observations
    if: github.repository == 'Wulfgardr/mediflow' && github.ref == 'refs/heads/codex/WUL-787-linux-diagnostics-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - name: Checkout immutable application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 347699434b321d5576d4e9debd706cc142d1f9fe
          path: runtime-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/native/MediFlowMac/Tests/MediFlowCoreTests/Fixtures/medical_fixture.db
      - name: Node for application and tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Build once and run the six closed diagnostic invocations
        run: >-
          node diagnostic-source/diagnostics/wul-787-linux/run.mjs
          "$GITHUB_WORKSPACE/runtime-source"
          "$RUNNER_TEMP/wul-787-linux-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wul-787-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wul-787-linux-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: warn
          retention-days: 7
