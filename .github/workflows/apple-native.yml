# RAMO DIAGNOSTICO, non per main: l'Agenda iPhone mentre cambia la dimensione del testo di sistema.
name: Apple Native
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agenda-text-size:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: scripts/generate-apple-xcodeproj.sh
      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r in sorted(d, reverse=True) for x in d[r] if x["name"].startswith("iPhone")))')
          echo "id=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project native/MediFlowAppleApp/MediFlowAppleApp.xcodeproj \
            -scheme MediFlowMobileApp -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5
      - name: Agenda while the system text size changes
        run: |
          UDID="${{ steps.sim.outputs.id }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          for giro in 1 2 3; do
            xcrun simctl ui "$UDID" content_size large || true
            xcodebuild test-without-building -project native/MediFlowAppleApp/MediFlowAppleApp.xcodeproj \
              -scheme MediFlowMobileApp -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -only-testing:MediFlowMobileAppUITests/MediFlowMobileAppUITests/testDiagnosticAgendaAcrossTextSizeChanges \
              -resultBundlePath "$RUNNER_TEMP/diag-$giro.xcresult" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/diag-$giro.log" 2>&1 &
            XC=$!
            while kill -0 $XC 2>/dev/null; do
              for size in extra-small large extra-extra-extra-large accessibility-medium accessibility-extra-extra-extra-large medium accessibility-large large; do
                kill -0 $XC 2>/dev/null || break
                xcrun simctl ui "$UDID" content_size "$size" >/dev/null 2>&1 || true
                echo "$(date +%T) dimensione $size"
                sleep 2
              done
            done
            wait $XC; echo "giro $giro: xcodebuild exit $?"
            mkdir -p "$RUNNER_TEMP/att-$giro"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/diag-$giro.xcresult" --output-path "$RUNNER_TEMP/att-$giro" >/dev/null 2>&1 || true
            for f in "$RUNNER_TEMP"/att-$giro/*.txt; do [ -f "$f" ] && { echo "--- CRONOLOGIA giro $giro"; cat "$f"; echo; echo "--- FINE"; }; done
            grep -E "error: |Test Case.*(passed|failed)" "$RUNNER_TEMP/diag-$giro.log" | sed 's/^/  /' | head -6
          done
          xcrun simctl ui "$UDID" content_size large || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agenda-text-size-${{ github.sha }}
          path: |
            ${{ runner.temp }}/diag-*.log
            ${{ runner.temp }}/att-*/
          retention-days: 7
