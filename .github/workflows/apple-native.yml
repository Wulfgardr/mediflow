# RAMO DIAGNOSTICO, non per main: misura il tasso di fallimento dell'audit di
# accessibilità iPhone a freddo (simulatore azzerato prima di ogni giro).
name: Apple Native
on:
  workflow_dispatch:
    inputs:
      test:
        description: nome del metodo di test
        default: testAccessibilityAuditCoversWorklistAndAgenda
      rounds:
        description: numero di giri
        default: '10'
permissions:
  contents: read
jobs:
  audit-loop:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: scripts/generate-apple-xcodeproj.sh
      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r in sorted(d, reverse=True) for x in d[r] if x["name"].startswith("iPhone")))')
          echo "id=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project native/MediFlowAppleApp/MediFlowAppleApp.xcodeproj \
            -scheme MediFlowMobileApp -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5
      - name: Cold audit loop
        run: |
          fails=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            xcrun simctl shutdown "${{ steps.sim.outputs.id }}" >/dev/null 2>&1 || true
            xcrun simctl erase "${{ steps.sim.outputs.id }}"
            if xcodebuild test-without-building -project native/MediFlowAppleApp/MediFlowAppleApp.xcodeproj \
                -scheme MediFlowMobileApp -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
                -derivedDataPath "$RUNNER_TEMP/dd" \
                -only-testing:MediFlowMobileAppUITests/MediFlowMobileAppUITests/${{ inputs.test }} \
                -resultBundlePath "$RUNNER_TEMP/audit-$i.xcresult" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/audit-$i.log" 2>&1; then
              echo "giro $i: PASS"
            else
              fails=$((fails+1)); echo "giro $i: FAIL"; grep -E "error: " "$RUNNER_TEMP/audit-$i.log" | sed 's/.*\] : /  /'
            fi
            mkdir -p "$RUNNER_TEMP/att-$i"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/audit-$i.xcresult" --output-path "$RUNNER_TEMP/att-$i" >/dev/null 2>&1 || true
            for f in "$RUNNER_TEMP"/att-$i/*.txt; do [ -f "$f" ] && { echo "  --- $(basename "$f")"; sed 's/^/  /' "$f" | head -12; }; done
          done
          echo "FALLIMENTI: $fails su ${{ inputs.rounds }} (${{ inputs.test }})" | tee "$RUNNER_TEMP/esito.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-loop-${{ github.sha }}
          path: |
            ${{ runner.temp }}/audit-*.log
            ${{ runner.temp }}/att-*/
            ${{ runner.temp }}/esito.txt
          retention-days: 7
