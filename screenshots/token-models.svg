  <text x="872" y="130" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2465">7,89 mld</text>
  <text x="872" y="115" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" letter-spacing="0.35" fill="#838d9b">STESSA SCALA</text>
