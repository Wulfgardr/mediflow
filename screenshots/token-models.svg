  <text x="48" y="637" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#838d9b">I token misurano soprattutto contesto riletto o recuperato dalla cache: volume assistito, non righe di codice o qualità.</text>
