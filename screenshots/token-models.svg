<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" width="920" height="650" role="img" aria-label="Uso dei modelli per MediFlow. Codex CLI: circa 7,89 miliardi di token, suddivisi tra GPT-5.5, GPT-5.4 e mini, GPT-5.6 Sol, GPT-5.3 Codex e Spark, GPT-5.6 Terra e modelli minori. Claude Code: circa 4,45 miliardi, suddivisi tra Opus 4.8, Fable 5, Sonnet 5 e Haiku 4.5 storico. Effort Codex: 5,15 miliardi xhigh, 1,16 medium, 0,73 high, 0,005 low; Ultra fan-out 0,84 miliardi. Questa revisione usa Opus 4.8 max.">
