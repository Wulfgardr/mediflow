[workspace]
members = ["client", "transport", "app"]
default-members = ["client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
mediflow-patient-client = { path = "client" }
mediflow-runtime-client = { path = "transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca", default-features = false, features = ["font-kit", "x11", "wayland"] }

# Applicable runtime/backend patches from the same upstream workspace. Cargo
# does not inherit patches from Git dependencies; keep these revisions explicit.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
