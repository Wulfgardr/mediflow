[package]
name = "mediflow-gpui-patient-pilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mediflow-gpui-patient-pilot"
path = "src/main.rs"

[dependencies]
mediflow-patient-client.workspace = true
mediflow-runtime-client.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
serde_json.workspace = true
unicode-segmentation = "1.12"
chrono = "0.4"
iana-time-zone = "0.1.65"
zeroize = "1.8"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
