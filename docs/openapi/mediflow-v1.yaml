openapi: 3.1.0
info:
  title: MediFlow Local API v1
  version: 1.10.0
  summary: Stable patient contract plus executable home-base network slice with explicit pairing review, paired-client auth boundary, scoped remote patient, diary, therapy, and checkup access/write boundaries, replica planning state, explicit identity summary, and declarative AI runtime summary for the local `/api/v1` surface.
  description: |
    OpenAPI contract for the client-facing local API defined by ADR 0010.
    Current thin slice covers stable patient reads plus compare-on-write patient
    mutations on `PUT /api/v1/patients/{id}` and `DELETE /api/v1/patients/{id}`.
    It also introduces the first documented `/api/v1/network/*` contract slice
    for home-base discovery, session gating, capability discovery, explicit
    pairing bootstrap/review on trusted local networks, the first read-only
    remote patient data plane, the first paired patient profile/status write
    boundary, the first paired clinical diary read/create/update boundary, and
    the first paired therapy read/create/update/soft-delete boundary, and the
    first paired checkup read/create/update/soft-delete boundary behind
    dedicated paired-client auth capabilities.
    Apple-native discovery may advertise the same PHI-safe node summary over
    Bonjour `_mediflow-homebase._tcp`, while `/api/v1/network/node` remains the
    reviewable HTTP summary contract for node identity and transport metadata.
    The session summary now includes PHI-safe replica planning metadata for
    snapshot mirror, deferred fallback, and manual review states. A dedicated
    identity summary distinguishes device pairing from operator login and
    declares the effective ambulatory scope. A dedicated AI runtime summary now
    separates `AI plane` and `data plane`, while real replication, offline sync,
    remote hard delete, remote attachment/document writes, remote inference
    routing, remote therapy/checkup hard delete, and advanced identity scoping
    remain follow-up workstreams.
servers:
  - url: https://127.0.0.1:3443
    description: Local HTTPS endpoint for native clients via TLS proxy.
  - url: http://127.0.0.1:3000
    description: Direct local development endpoint.
tags:
  - name: Patients
    description: Stable patient read contract plus compare-on-write patient mutations shared across web/native flows.
  - name: Network
    description: Home-base network contract for explicit pairing, capability discovery, and PHI-safe session gating.
paths:
  /api/v1/patients:
    get:
      tags:
        - Patients
      operationId: listPatients
      summary: List patients
      description: Returns patient summaries ordered by most recently updated.
      security:
        - bearerAuth: []
      parameters:
        - name: ambulatoryId
          in: query
          required: false
          description: Filter patients assigned to a specific ambulatory.
          schema:
            type: string
      responses:
        '200':
          description: Patient summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/patients/{id}:
    get:
      tags:
        - Patients
      operationId: getPatient
      summary: Get patient detail
      description: Returns the full stable patient payload for a specific patient id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      responses:
        '200':
          description: Patient detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Patients
      operationId: updatePatient
      summary: Update patient detail
      description: |
        Updates a patient using optimistic concurrency. Clients MUST send the last
        observed `version`. The server atomically compares it and returns `409`
        with PHI-safe metadata when the record changed or disappeared.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMutationRequest'
            examples:
              archivePatient:
                value:
                  version: 7
                  isArchived: true
              updateDemographics:
                value:
                  version: 7
                  firstName: Mario
                  lastName: Rossi
                  phone: "+39 333 1234567"
      responses:
        '200':
          description: Patient updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PatientVersionConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Patients
      operationId: deletePatient
      summary: Delete patient
      description: |
        Deletes a patient using optimistic concurrency. Clients MUST send the last
        observed `version`. The server returns `409` with PHI-safe metadata when
        the record changed or disappeared before the delete could commit.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientDeleteRequest'
            examples:
              deletePatient:
                value:
                  version: 7
      responses:
        '200':
          description: Patient deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PatientVersionConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/node:
    get:
      tags:
        - Network
      operationId: getNetworkNode
      summary: Get home-base node summary
      description: |
        Returns PHI-safe metadata for the local node that may act as a trusted
        home-base candidate. This is not a trust bootstrap by itself.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PHI-safe home-base candidate summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkNodeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/session:
    get:
      tags:
        - Network
      operationId: getNetworkSession
      summary: Get network session gate state
      description: |
        Returns the current network operating mode and pairing gate seen by the
        local node. This endpoint distinguishes simple connectivity from a future
        trusted paired session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current PHI-safe network session gate state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/capabilities:
    get:
      tags:
        - Network
      operationId: listNetworkCapabilities
      summary: List home-base capabilities
      description: |
        Returns the versionable capability matrix exposed by the current node.
        Capabilities may be `available`, `disabled`, `planned`, or `unavailable`
        while only the first read-only remote patient surface is live; sync,
        cache, and broader replica flows remain follow-up workstreams.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Versionable capability matrix for the current node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/identity:
    get:
      tags:
        - Network
      operationId: getNetworkIdentity
      summary: Get network identity and scope summary
      description: |
        Returns the PHI-safe identity model for the current node. This summary
        makes explicit that device pairing is separate from operator login and
        declares the effective ambulatory scope resolved by the node.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current PHI-safe network identity summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkIdentitySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/ai-runtime:
    get:
      tags:
        - Network
      operationId: getNetworkAiRuntime
      summary: Get AI runtime routing summary
      description: |
        Returns the PHI-safe AI runtime posture declared by the current node.
        This summary keeps `AI plane` separate from the shared `data plane` and
        only describes local-vs-centralized capability plus fallback policy.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current PHI-safe AI runtime summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAiRuntimeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/pairing-intents:
    get:
      tags:
        - Network
      operationId: listNetworkPairingIntents
      summary: List pending pairing intents
      description: |
        Returns the pending pairing bootstrap intents waiting for explicit local
        confirmation on the home-base node.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending pairing intents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkPairingIntentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Network
      operationId: createNetworkPairingIntent
      summary: Create pairing bootstrap intent
      description: |
        Requests an explicit pairing bootstrap intent for a trusted LAN client.
        This does not complete trust by itself. If the node is still in
        `local-only` mode, the server returns a PHI-safe `409` gate response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkPairingIntentRequest'
            examples:
              ipadPairing:
                value:
                  deviceName: Front Desk iPad
                  clientPlatform: ipados
                  appVersion: 0.5.0
                  requestedCapabilities:
                    - network.replica.readonly-patients
      responses:
        '201':
          description: Pairing bootstrap intent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPairingIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidNetworkPairingIntent'
        '409':
          $ref: '#/components/responses/NetworkModeDisabled'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/pairing-intents/{intentId}/confirm:
    post:
      tags:
        - Network
      operationId: confirmNetworkPairingIntent
      summary: Confirm pairing intent and mint paired-client credentials
      description: |
        Confirms a pending pairing intent on the local node, emits the one-time
        paired-client token, and persists a device-specific trust record
        distinct from the generic local API token.
      security:
        - bearerAuth: []
      parameters:
        - name: intentId
          in: path
          required: true
          description: Pending pairing intent identifier.
          schema:
            type: string
      responses:
        '201':
          description: Pairing confirmed and paired-client credentials minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPairingConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PairingIntentNotFound'
        '409':
          description: Pairing confirmation is blocked by node mode or expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkErrorResponse'
              examples:
                localOnlyGate:
                  value:
                    error: Conflict
                    code: NETWORK_MODE_DISABLED
                    message: Home-base network mode is not enabled on this node.
                expiredIntent:
                  value:
                    error: Conflict
                    code: PAIRING_INTENT_EXPIRED
                    message: Pairing intent has expired and must be requested again.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/patients:
    get:
      tags:
        - Network
      operationId: listNetworkPatients
      summary: List patients through the paired home-base data plane
      description: |
        Returns read-only patient summaries scoped by the effective ambulatory
        resolved on the home-base node. This route requires both a valid paired
        client credential and an operator session cookie.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      responses:
        '200':
          description: Read-only scoped patient summaries from the paired node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientSummary'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/patients/{id}:
    get:
      tags:
        - Network
      operationId: getNetworkPatient
      summary: Get patient detail through the paired home-base data plane
      description: |
        Returns read-only patient detail from the paired node, limited to the
        effective ambulatory scope resolved by the home-base. This route
        requires both a valid paired client credential and an operator session
        cookie.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      responses:
        '200':
          description: Read-only scoped patient detail from the paired node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetail'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Network
      operationId: updateNetworkPatient
      summary: Update patient profile/status through the paired home-base data plane
      description: |
        Updates a patient profile/status subset from a paired client using the
        same optimistic concurrency shape as the local patient mutation
        contract. The route requires a paired client with
        `network.replica.write-patient-profile`, an active operator session,
        and the effective ambulatory scope resolved by the home-base node.
        AI/document-derived fields, child clinical CRUD, remote delete, and
        sync queues remain outside this first write boundary.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMutationRequest'
            examples:
              updateNetworkPhone:
                value:
                  version: 7
                  phone: "+39 333 1234567"
              archiveNetworkPatient:
                value:
                  version: 7
                  isArchived: true
      responses:
        '200':
          description: Patient updated through the paired boundary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PatientVersionConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/patients/{id}/entries:
    get:
      tags:
        - Network
      operationId: listNetworkPatientEntries
      summary: List clinical diary entries through the paired home-base data plane
      description: |
        Returns clinical diary entries for one patient, limited to the effective
        ambulatory scope resolved by the home-base. This route requires a valid
        paired client with `network.replica.readonly-clinical-diary` and an
        operator session cookie.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Scoped clinical diary entries from the paired node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryDetail'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Network
      operationId: createNetworkPatientEntry
      summary: Create a clinical diary entry through the paired home-base data plane
      description: |
        Creates a clinical diary entry for one scoped patient. The route requires
        a paired client with `network.replica.write-clinical-diary`, an active
        operator session, and the effective ambulatory scope resolved by the
        home-base node. Remote attachment/document-derived writes and AI fields
        are excluded from this boundary.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreateRequest'
            examples:
              createNetworkEntry:
                value:
                  type: note
                  title: Diario clinico
                  date: '2026-05-02T09:00:00.000Z'
                  content: Nota preparata dal client paired
                  setting: ambulatory
      responses:
        '201':
          description: Entry created through the paired boundary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/patients/{id}/entries/{entryId}:
    get:
      tags:
        - Network
      operationId: getNetworkPatientEntry
      summary: Get a clinical diary entry through the paired home-base data plane
      description: |
        Returns one clinical diary entry for a scoped patient. This route
        requires a paired client with `network.replica.readonly-clinical-diary`
        and an operator session cookie.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
        - name: entryId
          in: path
          required: true
          description: Clinical diary entry identifier.
          schema:
            type: string
      responses:
        '200':
          description: Scoped clinical diary entry from the paired node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDetail'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Network
      operationId: updateNetworkPatientEntry
      summary: Update or soft-delete a clinical diary entry through the paired home-base data plane
      description: |
        Updates a clinical diary entry using entry-level optimistic concurrency.
        The route requires a paired client with
        `network.replica.write-clinical-diary`, an active operator session, and
        the effective ambulatory scope resolved by the home-base node. Hard
        delete, remote attachment/document writes, and AI/document-derived
        fields are excluded; soft delete and restore use `deletedAt` and
        `deletionReason`.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
        - name: entryId
          in: path
          required: true
          description: Clinical diary entry identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryMutationRequest'
            examples:
              updateNetworkEntry:
                value:
                  version: 2
                  content: Nota aggiornata dal client paired
              softDeleteNetworkEntry:
                value:
                  version: 2
                  deletedAt: '2026-05-02T10:00:00.000Z'
                  deletionReason: duplicate-entry
      responses:
        '200':
          description: Entry updated through the paired boundary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryVersionConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/patients/{id}/therapies:
    get:
      tags:
        - Network
      operationId: listNetworkPatientTherapies
      summary: List therapies through the paired home-base data plane
      description: |
        Returns therapies for one patient, limited to the effective ambulatory
        scope resolved by the home-base. This route requires a valid paired
        client with `network.replica.readonly-therapies` and an operator session
        cookie.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Scoped therapies from the paired node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TherapyDetail'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Network
      operationId: createNetworkPatientTherapy
      summary: Create a therapy through the paired home-base data plane
      description: |
        Creates a therapy for one scoped patient. The route requires a paired
        client with `network.replica.write-therapies`, an active operator
        session, and the effective ambulatory scope resolved by the home-base
        node. AI/document-derived fields and client-controlled lifecycle fields
        are excluded from this boundary.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TherapyCreateRequest'
            examples:
              createNetworkTherapy:
                value:
                  drugName: Metformina
                  dosage: 500 mg x 2
                  status: active
                  startDate: '2026-05-02T09:00:00.000Z'
      responses:
        '201':
          description: Therapy created through the paired boundary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapyCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
