components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: "Local API token expected in `Authorization: Bearer <token>`."
    pairedClientId:
      type: apiKey
      in: header
      name: x-mediflow-paired-client-id
      description: Explicit paired-device identifier minted during local pairing confirmation.
    pairedClientToken:
      type: apiKey
      in: header
      name: x-mediflow-paired-client-token
      description: One-time paired-device token minted during local pairing confirmation.
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: mediflow_session
      description: Operator session cookie required for the remote network data plane.
  responses:
    BadRequest:
      description: Request payload is invalid or missing required mutation metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingVersion:
              value:
                error: Version is required
            noFields:
              value:
                error: No valid fields to update
    InvalidNetworkPairingIntent:
      description: Network pairing intent payload is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkErrorResponse'
          examples:
            missingDeviceName:
              value:
                error: Bad Request
                code: PAIRING_REQUEST_INVALID
                message: deviceName is required.
    Unauthorized:
      description: Missing or invalid local API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: Unauthorized
    NetworkDataPlaneUnauthorized:
      description: Missing or invalid paired client credential, or missing operator session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: Unauthorized
    Forbidden:
      description: Request is authenticated but blocked by missing scope or missing granted capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error: Forbidden
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error: Not found
    PairingIntentNotFound:
      description: Requested pairing intent was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkErrorResponse'
          examples:
            notFound:
              value:
                error: Not Found
                code: PAIRING_INTENT_NOT_FOUND
                message: Pairing intent not found.
    NetworkModeDisabled:
      description: |
        Pairing bootstrap is disabled because the node still operates in
        `local-only` mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkErrorResponse'
          examples:
            localOnlyGate:
              value:
                error: Conflict
                code: NETWORK_MODE_DISABLED
                message: Home-base network mode is not enabled on this node.
    PatientVersionConflict:
      description: |
        Compare-on-write conflict. The payload exposes only PHI-safe metadata so
        clients can refresh, inspect the version delta, and decide whether to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatientVersionConflictResponse'
          examples:
            outdatedVersion:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: patient
                recordId: patient_123
                expectedVersion: 7
                currentVersion: 8
                currentUpdatedAt: '2026-03-16T10:15:00.000Z'
                currentState: present
                currentSnapshot:
                  id: patient_123
                  version: 8
                  updatedAt: '2026-03-16T10:15:00.000Z'
                  isArchived: false
            deletedElsewhere:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: patient
                recordId: patient_123
                expectedVersion: 7
                currentVersion: null
                currentUpdatedAt: null
                currentState: missing
                currentSnapshot: null
    EntryVersionConflict:
      description: |
        Entry compare-on-write conflict. The payload exposes only PHI-safe
        metadata so clients can refresh and decide whether to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntryVersionConflictResponse'
          examples:
            outdatedVersion:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: entry
                recordId: entry_123
                expectedVersion: 2
                currentVersion: 3
                currentUpdatedAt: '2026-05-02T10:15:00.000Z'
                currentState: present
                currentSnapshot:
                  id: entry_123
                  patientId: patient_123
                  version: 3
                  updatedAt: '2026-05-02T10:15:00.000Z'
                  deletedAt: null
            missingEntry:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: entry
                recordId: entry_123
                expectedVersion: 2
                currentVersion: null
                currentUpdatedAt: null
                currentState: missing
                currentSnapshot: null
    TherapyVersionConflict:
      description: |
        Therapy compare-on-write conflict. The payload exposes only PHI-safe
        metadata so clients can refresh and decide whether to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TherapyVersionConflictResponse'
          examples:
            outdatedVersion:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: therapy
                recordId: therapy_123
                expectedVersion: 2
                currentVersion: 3
                currentUpdatedAt: '2026-05-02T10:15:00.000Z'
                currentState: present
                currentSnapshot:
                  id: therapy_123
                  patientId: patient_123
                  version: 3
                  updatedAt: '2026-05-02T10:15:00.000Z'
                  deletedAt: null
            missingTherapy:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: therapy
                recordId: therapy_123
                expectedVersion: 2
                currentVersion: null
                currentUpdatedAt: null
                currentState: missing
                currentSnapshot: null
    CheckupVersionConflict:
      description: |
        Checkup compare-on-write conflict. The payload exposes only PHI-safe
        metadata so clients can refresh and decide whether to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CheckupVersionConflictResponse'
          examples:
            outdatedVersion:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: checkup
                recordId: checkup_123
                expectedVersion: 2
                currentVersion: 3
                currentUpdatedAt: '2026-05-02T10:15:00.000Z'
                currentState: present
                currentSnapshot:
                  id: checkup_123
                  patientId: patient_123
                  version: 3
                  updatedAt: '2026-05-02T10:15:00.000Z'
                  deletedAt: null
            missingCheckup:
              value:
                error: Conflict
                code: VERSION_CONFLICT
                entity: checkup
                recordId: checkup_123
                expectedVersion: 2
                currentVersion: null
                currentUpdatedAt: null
                currentState: missing
                currentSnapshot: null
    InternalServerError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            patientListFailure:
              value:
                error: Failed to fetch patients
            patientDetailFailure:
              value:
                error: Failed to fetch patient
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    NetworkErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - code
        - message
      properties:
        error:
          type: string
          enum:
            - Bad Request
            - Conflict
            - Not Found
        code:
          type: string
          enum:
            - PAIRING_REQUEST_INVALID
            - NETWORK_MODE_DISABLED
            - PAIRING_INTENT_NOT_FOUND
            - PAIRING_INTENT_EXPIRED
        message:
          type: string
    NetworkNodeSummary:
      type: object
      additionalProperties: false
      required:
        - nodeId
        - displayName
        - role
        - operatingMode
        - protocolVersion
        - transport
      properties:
        nodeId:
          type: string
        displayName:
          type: string
        role:
          type: string
          const: home-base-candidate
        operatingMode:
          type: string
          enum:
            - local-only
            - network-home-base
        protocolVersion:
          type: string
        transport:
          type: object
          additionalProperties: false
          required:
            - apiBasePath
            - tlsRequired
            - localTlsPort
          properties:
            apiBasePath:
              type: string
              const: /api/v1
            tlsRequired:
              type: boolean
              const: true
            localTlsPort:
              type: integer
              const: 3443
    NetworkSessionSummary:
      type: object
      additionalProperties: false
      required:
        - nodeId
        - operatingMode
        - sessionState
        - pairingState
        - trustedSession
        - degradedReason
        - authMode
        - protocolVersion
        - replica
      properties:
        nodeId:
          type: string
        operatingMode:
          type: string
          enum:
            - local-only
            - network-home-base
        sessionState:
          type: string
          enum:
            - local-only
            - network-unpaired
            - network-paired-online
            - network-paired-offline-degraded
        pairingState:
          type: string
          enum:
            - disabled
            - required
            - paired
        trustedSession:
          type: boolean
        degradedReason:
          type:
            - string
            - 'null'
        authMode:
          type: string
          enum:
            - bearer-token
            - paired-client-plus-session
        protocolVersion:
          type: string
        replica:
          $ref: '#/components/schemas/NetworkReplicaSummary'
    NetworkReplicaSummary:
      type: object
      additionalProperties: false
      required:
        - strategy
        - state
        - authority
        - pendingAction
        - conflictMode
        - backupBoundary
        - lastSnapshotAt
        - lastReconciledAt
      properties:
        strategy:
          type: string
          const: encrypted-snapshot-mirror
        state:
          type: string
          enum:
            - local-only
            - unpaired
            - online
            - offline-deferred
            - conflict-review
        authority:
          type: string
          enum:
            - local-device
            - paired-home-base
        pendingAction:
          type: string
          enum:
            - none
            - pairing-required
            - queue-snapshot
            - manual-review
        conflictMode:
          type: string
          const: restore-preflight-plus-version-check
        backupBoundary:
          type: string
          const: artifact-v1-remains-backup-only
        lastSnapshotAt:
          type:
            - string
            - 'null'
          format: date-time
        lastReconciledAt:
          type:
            - string
            - 'null'
          format: date-time
    NetworkIdentityOperatorSummary:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - displayName
        - role
        - authChannel
      properties:
        userId:
          type:
            - string
            - 'null'
        username:
          type:
            - string
            - 'null'
        displayName:
          type:
            - string
            - 'null'
        role:
          type:
            - string
            - 'null'
        authChannel:
          type: string
          enum:
            - web
            - native
            - system
            - none
    NetworkIdentityScopeSummary:
      type: object
      additionalProperties: false
      required:
        - policy
        - effectiveAmbulatoryId
        - effectiveAmbulatoryName
        - defaultAmbulatoryId
        - defaultAmbulatoryName
        - source
      properties:
        policy:
          type: string
          const: session-context-else-node-default
        effectiveAmbulatoryId:
          type:
            - string
            - 'null'
        effectiveAmbulatoryName:
          type:
            - string
            - 'null'
        defaultAmbulatoryId:
          type:
            - string
            - 'null'
        defaultAmbulatoryName:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - session-context
            - node-default
            - none
    NetworkIdentityAuditSummary:
      type: object
      additionalProperties: false
      required:
        - actorType
        - actorBinding
      properties:
        actorType:
          type: string
          enum:
            - user
            - system
        actorBinding:
          type: string
          enum:
            - session-user
            - token-only
    NetworkIdentitySummary:
      type: object
      additionalProperties: false
      required:
        - identityModel
        - pairingBoundary
        - credentialState
        - loginMode
        - usernameHint
        - displayNameHint
        - operator
        - scope
        - audit
        - limitations
      properties:
        identityModel:
          type: string
          const: paired-device-plus-node-credentials
        pairingBoundary:
          type: string
          const: device-pairing-separate-from-operator-login
        credentialState:
          type: string
          enum:
            - session-bound
            - node-credentials-required
        loginMode:
          type: string
          enum:
            - single-local-user-default
            - explicit-username-required
        usernameHint:
          type:
            - string
            - 'null'
        displayNameHint:
          type:
            - string
            - 'null'
        operator:
          $ref: '#/components/schemas/NetworkIdentityOperatorSummary'
        scope:
          $ref: '#/components/schemas/NetworkIdentityScopeSummary'
        audit:
          $ref: '#/components/schemas/NetworkIdentityAuditSummary'
        limitations:
          type: array
          items:
            type: string
    NetworkAiRuntimeLocalRuntime:
      type: object
      additionalProperties: false
      required:
        - provider
        - state
        - targetPolicy
        - hardwareProfile
        - clinicalModel
        - reasoningModel
        - ocrModel
      properties:
        provider:
          type: string
          const: ollama
        state:
          type: string
          enum:
            - configured
            - misconfigured
        targetPolicy:
          type: string
          const: loopback-only
        hardwareProfile:
          type: string
          enum:
            - low
            - medium
            - high
            - custom
            - unknown
        clinicalModel:
          type:
            - string
            - 'null'
        reasoningModel:
          type:
            - string
            - 'null'
        ocrModel:
          type:
            - string
            - 'null'
    NetworkAiRuntimeCentralRuntime:
      type: object
      additionalProperties: false
      required:
        - state
        - capabilityStatus
        - requiresPairing
        - executionTarget
      properties:
        state:
          type: string
          enum:
            - disabled
            - available
            - unavailable
        capabilityStatus:
          type: string
          enum:
            - disabled
            - available
            - unavailable
        requiresPairing:
          type: boolean
          const: true
        executionTarget:
          type: string
          const: paired-home-base
    NetworkAiRuntimeSummary:
      type: object
      additionalProperties: false
      required:
        - plane
        - mode
        - localRuntime
        - centralRuntime
        - fallbackPolicy
        - rolloutGate
        - surfaces
        - guardrails
      properties:
        plane:
          type: string
          const: ai-plane-separate-from-data-plane
        mode:
          type: string
          enum:
            - local-ai
            - centralized-available
            - centralized-unavailable
        localRuntime:
          $ref: '#/components/schemas/NetworkAiRuntimeLocalRuntime'
        centralRuntime:
          $ref: '#/components/schemas/NetworkAiRuntimeCentralRuntime'
        fallbackPolicy:
          type: string
          const: client-local-runtime-else-ai-unavailable
        rolloutGate:
          type: string
          const: lane-benchmarks-and-rollout-governance-required
        surfaces:
          type: array
          items:
            type: string
            enum:
              - patient-insight
              - smart-import
              - document-synthesis
        guardrails:
          type: array
          items:
            type: string
    NetworkCapability:
      type: object
      additionalProperties: false
      required:
        - key
        - status
        - requiresPairing
        - description
      properties:
        key:
          type: string
          enum:
            - network.pairing.bootstrap
            - network.replica.readonly-patients
