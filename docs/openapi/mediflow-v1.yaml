components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: "Local API token expected in `Authorization: Bearer <token>`."
    pairedClientId:
      type: apiKey
      in: header
      name: x-mediflow-paired-client-id
      description: Explicit paired-device identifier minted during local pairing confirmation.
    pairedClientToken:
      type: apiKey
      in: header
      name: x-mediflow-paired-client-token
      description: One-time paired-device token minted during local pairing confirmation.
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: mediflow_session
      description: Operator session cookie required for the remote network data plane.
  responses:
    BadRequest:
      description: Request payload is invalid or missing required mutation metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingVersion:
              value:
                error: Version is required
            noFields:
              value:
                error: No valid fields to update
    InvalidNetworkPairingIntent:
      description: Network pairing intent payload is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkErrorResponse'
          examples:
            missingDeviceName:
              value:
                error: Bad Request
                code: PAIRING_REQUEST_INVALID
                message: deviceName is required.
    Unauthorized:
      description: Missing or invalid local API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: Unauthorized
    NetworkDataPlaneUnauthorized:
      description: Missing or invalid paired client credential, or missing operator session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: Unauthorized
    Forbidden:
      description: Request is authenticated but blocked by missing scope or missing granted capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error: Forbidden
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error: Not found
    PairingIntentNotFound:
      description: Requested pairing intent was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkErrorResponse'
          examples:
            notFound:
              value:
                error: Not Found
                code: PAIRING_INTENT_NOT_FOUND
                message: Pairing intent not found.
    NetworkModeDisabled:
      description: |
        Pairing bootstrap is disabled because the node still operates in
        `local-only` mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkErrorResponse'
          examples:
