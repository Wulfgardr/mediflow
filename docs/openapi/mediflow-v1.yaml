  /api/v1/network/patients:
    get:
      tags:
        - Network
      operationId: listNetworkPatients
      summary: List patients through the paired home-base data plane
      description: |
        Returns read-only patient summaries scoped by the effective ambulatory
        resolved on the home-base node. This route requires both a valid paired
        client credential and an operator session cookie. `includeDeleted=true`
        also requires `network.replica.write-patient-lifecycle` and returns
        tombstoned patients with their deletion metadata.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: includeDeleted
          in: query
          required: false
          description: Include soft-deleted patients when set to `true`.
          schema:
            type: boolean
        - name: include
          in: query
          required: false
          description: Add sealed diagnoses to each summary when set to `diagnoses`.
          schema:
            type: string
            enum:
              - diagnoses
      responses:
        '200':
          description: Read-only scoped patient summaries from the paired node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientSummary'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Network
      operationId: createNetworkPatient
      summary: Create patient through the paired lifecycle boundary
      description: |
        Creates a patient and its ambulatory membership atomically from a paired
        client with `network.replica.write-patient-lifecycle`. The insert always
        targets the effective ambulatory scope resolved for the paired session,
        the same resolution used by the other network patient routes; a body
        `ambulatoryId` that differs from that scope is rejected.
        Sensitive optional fields must already be sealed with the `ENC:` format.
        AI/document fields are rejected.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkPatientCreateRequest'
            examples:
              createNetworkPatient:
                value:
                  firstName: Ada
                  lastName: Lovelace
                  taxCode: LVLDAA85A01F205X
                  birthDate: '1985-01-01T00:00:00.000Z'
                  address: ENC:iv:ciphertext
                  notes: ENC:iv:notes
      responses:
        '201':
          description: Patient created through the paired lifecycle boundary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedVersionedResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
