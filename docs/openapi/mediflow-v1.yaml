      description: |
        Returns read-only checkups for patients in the effective ambulatory scope,
        ordered by date ascending. Requires
        `network.replica.readonly-agenda`, paired client credentials, and an
        operator session. Filters and ordering use plaintext columns only; notes
        remain opaque ciphertext for client-side decryption.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum result count, default 200 and capped at 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: status
          in: query
          required: false
          description: Repeatable plaintext checkup status filter.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Read-only ambulatory-scoped checkups from the paired node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckupDetail'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
