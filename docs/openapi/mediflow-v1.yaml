openapi: 3.1.0
info:
  title: MediFlow Local API v1
  version: 1.18.0
  summary: Stable patient contract plus executable home-base network slice with explicit pairing review, paired-client auth boundary, ambulatory scope options, scoped remote patient, cross-patient agenda and diary reads, therapy, checkup, observation, and catalog read boundaries, replica planning state, explicit identity summary, and declarative AI runtime summary for the local `/api/v1` surface.
  description: |
    OpenAPI contract for the client-facing local API defined by ADR 0010.
    Current thin slice covers stable patient reads plus compare-on-write patient
    mutations on `PUT /api/v1/patients/{id}` and `DELETE /api/v1/patients/{id}`.
    It also introduces the first documented `/api/v1/network/*` contract slice
    for home-base discovery, session gating, capability discovery, explicit
    pairing bootstrap/review on trusted local networks, the first read-only
    remote patient data plane, the first paired patient profile/status write
    boundary, the first paired clinical diary read/create/update boundary, the
    first paired therapy read/create/update/soft-delete boundary, the first
    paired checkup read/create/update/soft-delete boundary, the first paired
    observation read/create/update/soft-delete boundary, and the first paired
    read-only catalog boundary for global drug, exemption, and terminology
    reference data behind dedicated paired-client auth capabilities.
    Apple-native discovery may advertise the same PHI-safe node summary over
    Bonjour `_mediflow-homebase._tcp`, while `/api/v1/network/node` remains the
    reviewable HTTP summary contract for node identity and transport metadata.
    The session summary now includes PHI-safe replica planning metadata for
    snapshot mirror, deferred fallback, and manual review states. A dedicated
    identity summary distinguishes device pairing from operator login and
    declares the effective ambulatory scope. A dedicated AI runtime summary now
    separates `AI plane` and `data plane`, while real replication, offline sync,
    remote hard delete, remote attachment/document writes, remote inference
    routing, remote therapy/checkup/observation hard delete, and advanced
    identity scoping remain follow-up workstreams.
servers:
  - url: https://127.0.0.1:3443
    description: Local HTTPS endpoint for native clients via TLS proxy.
  - url: http://127.0.0.1:3000
    description: Direct local development endpoint.
tags:
  - name: Patients
    description: Stable patient read contract plus compare-on-write patient mutations shared across web/native flows.
  - name: Network
    description: Home-base network contract for explicit pairing, capability discovery, and PHI-safe session gating.
paths:
  /api/v1/patients:
    get:
      tags:
        - Patients
      operationId: listPatients
      summary: List patients
      description: Returns patient summaries ordered by most recently updated.
      security:
        - bearerAuth: []
      parameters:
        - name: ambulatoryId
          in: query
          required: false
          description: Filter patients assigned to a specific ambulatory.
          schema:
            type: string
      responses:
        '200':
          description: Patient summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/patients/{id}:
    get:
      tags:
        - Patients
      operationId: getPatient
      summary: Get patient detail
      description: Returns the full stable patient payload for a specific patient id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      responses:
        '200':
          description: Patient detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Patients
      operationId: updatePatient
      summary: Update patient detail
      description: |
        Updates a patient using optimistic concurrency. Clients MUST send the last
        observed `version`. The server atomically compares it and returns `409`
        with PHI-safe metadata when the record changed or disappeared.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMutationRequest'
            examples:
              archivePatient:
                value:
                  version: 7
                  isArchived: true
                  archiveReason: ENC:opaque-archive-reason
              updateDemographics:
                value:
                  version: 7
                  firstName: Mario
                  lastName: Rossi
                  phone: "+39 333 1234567"
      responses:
        '200':
          description: Patient updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PatientVersionConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Patients
      operationId: deletePatient
      summary: Delete patient
      description: |
        Deletes a patient using optimistic concurrency. Clients MUST send the last
        observed `version`. The server retires the record with a soft-delete
        tombstone (ADR 0066): the patient disappears from reads while linked
        clinical rows stay preserved for an explicit, audited admin purge. The
        server returns `409` with PHI-safe metadata when the record changed or
        disappeared before the delete could commit.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSoftDeleteRequest'
            examples:
              deletePatient:
                value:
                  version: 7
                  deletionReason: ENC:opaque-deletion-reason
      responses:
        '200':
          description: Patient deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PatientVersionConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/node:
    get:
      tags:
        - Network
      operationId: getNetworkNode
      summary: Get home-base node summary
      description: |
        Returns PHI-safe metadata for the local node that may act as a trusted
        home-base candidate. This is not a trust bootstrap by itself.
      security:
        - bearerAuth: []
        - pairedClientId: []
          pairedClientToken: []
      responses:
        '200':
          description: PHI-safe home-base candidate summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkNodeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/session:
    get:
      tags:
        - Network
      operationId: getNetworkSession
      summary: Get network session gate state
      description: |
        Returns the current network operating mode and pairing gate seen by the
        local node. This endpoint distinguishes simple connectivity from a future
        trusted paired session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current PHI-safe network session gate state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/capabilities:
    get:
      tags:
        - Network
      operationId: listNetworkCapabilities
      summary: List home-base capabilities
      description: |
        Returns the versionable capability matrix exposed by the current node.
        Capabilities may be `available`, `disabled`, `planned`, or `unavailable`
        while only the first read-only remote patient surface is live; sync,
        cache, and broader replica flows remain follow-up workstreams.
      security:
        - bearerAuth: []
        - pairedClientId: []
          pairedClientToken: []
      responses:
        '200':
          description: Versionable capability matrix for the current node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/identity:
    get:
      tags:
        - Network
      operationId: getNetworkIdentity
      summary: Get network identity and scope summary
      description: |
        Returns the PHI-safe identity model for the current node. This summary
        makes explicit that device pairing is separate from operator login and
        declares the effective ambulatory scope resolved by the node.
      security:
        - bearerAuth: []
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      responses:
        '200':
          description: Current PHI-safe network identity summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkIdentitySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/revision:
    get:
      tags:
        - Network
      operationId: getNetworkRevision
      summary: Get public home-base revision fingerprint
      description: |
        Returns only the public revision tuple a paired client needs to detect
        that the home-base source changed. Branch and worktree hash remain
        limited to the session-gated web revision route.
      security:
        - pairedClientId: []
          pairedClientToken: []
      responses:
        '200':
          description: Public revision tuple for the paired home-base.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRevisionSummary'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/NetworkModeDisabled'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/ai-runtime:
    get:
      tags:
        - Network
      operationId: getNetworkAiRuntime
      summary: Get AI runtime routing summary
      description: |
        Returns the PHI-safe AI runtime posture declared by the current node.
        This summary keeps `AI plane` separate from the shared `data plane` and
        only describes local-vs-centralized capability plus fallback policy.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current PHI-safe AI runtime summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAiRuntimeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/pairing-intents:
    get:
      tags:
        - Network
      operationId: listNetworkPairingIntents
      summary: List pending pairing intents
      description: |
        Returns the pending pairing bootstrap intents waiting for explicit local
        confirmation on the home-base node.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending pairing intents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkPairingIntentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Network
      operationId: createNetworkPairingIntent
      summary: Create pairing bootstrap intent
      description: |
        Requests an explicit pairing bootstrap intent for a trusted LAN client.
        This does not complete trust by itself. If the node is still in
        `local-only` mode, the server returns a PHI-safe `409` gate response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkPairingIntentRequest'
            examples:
              ipadPairing:
                value:
                  deviceName: Front Desk iPad
                  clientPlatform: ipados
                  appVersion: 0.5.0
                  requestedCapabilities:
                    - network.replica.readonly-patients
      responses:
        '201':
          description: Pairing bootstrap intent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPairingIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidNetworkPairingIntent'
        '409':
          $ref: '#/components/responses/NetworkModeDisabled'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/pairing-intents/{intentId}/confirm:
    post:
      tags:
        - Network
      operationId: confirmNetworkPairingIntent
      summary: Confirm pairing intent and mint paired-client credentials
      description: |
        Confirms a pending pairing intent on the local node, emits the one-time
        paired-client token, and persists a device-specific trust record
        distinct from the generic local API token.
      security:
        - bearerAuth: []
      parameters:
        - name: intentId
          in: path
          required: true
          description: Pending pairing intent identifier.
          schema:
            type: string
      responses:
        '201':
          description: Pairing confirmed and paired-client credentials minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPairingConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PairingIntentNotFound'
        '409':
          description: Pairing confirmation is blocked by node mode or expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkErrorResponse'
              examples:
                localOnlyGate:
                  value:
                    error: Conflict
                    code: NETWORK_MODE_DISABLED
                    message: Home-base network mode is not enabled on this node.
                expiredIntent:
                  value:
                    error: Conflict
                    code: PAIRING_INTENT_EXPIRED
                    message: Pairing intent has expired and must be requested again.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/ambulatories:
    get:
      tags:
        - Network
      operationId: listNetworkAmbulatories
      summary: List ambulatory scope options through the paired home-base data plane
      description: |
        Returns the ambulatory summaries the paired app uses to drive its scope
        picker. Rides on the read-only patient capability and requires both a
        valid paired client credential and an operator session cookie.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      responses:
        '200':
          description: Ambulatory scope options available to the paired node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmbulatorySummary'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/drugs:
    get:
      tags:
        - Network
      operationId: listNetworkDrugs
      summary: List drug catalog entries through the paired home-base data plane
      description: |
        Returns the same global drug reference catalog shape exposed by the
        host `/api/v1/drugs` read route. This paired route requires the
        `network.catalogs.readonly` capability plus a valid paired client
        credential and operator session cookie. Drug catalog data is global
        reference data and is not filtered by ambulatory scope.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Optional case-insensitive search over drug name, active principle, or AIC.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of rows to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: count
          in: query
          required: false
          description: Return only the catalog count when set to `1`.
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Drug catalog entries, or a count-only payload when requested.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/DrugSummary'
                  - $ref: '#/components/schemas/CatalogCountResponse'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/exemptions:
    get:
      tags:
        - Network
      operationId: listNetworkExemptions
      summary: List exemption catalog entries through the paired home-base data plane
      description: |
        Returns the same global exemption reference catalog shape exposed by
        the host `/api/v1/exemptions` read route. This paired route requires
        the `network.catalogs.readonly` capability plus a valid paired client
        credential and operator session cookie. Exemption catalog data is
        global reference data and is not filtered by ambulatory scope.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Optional case-insensitive search over exemption code or description.
          schema:
            type: string
        - name: codes
          in: query
          required: false
          description: Optional comma-separated exemption codes to resolve in bulk.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of rows to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: count
          in: query
          required: false
          description: Return only the catalog count when set to `1`.
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Exemption catalog entries, or a count-only payload when requested.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/ExemptionSummary'
                  - $ref: '#/components/schemas/CatalogCountResponse'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/terminology/search:
    get:
      tags:
        - Network
      operationId: searchNetworkTerminology
      summary: Search terminology catalog entries through the paired home-base data plane
      description: |
        Returns the same global terminology search shape exposed by the host
        `/api/v1/terminology/search` read route. This paired route requires
        the `network.catalogs.readonly` capability plus a valid paired client
        credential and operator session cookie. Terminology catalog data is
        global reference data and is not filtered by ambulatory scope.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: system
          in: query
          required: true
          description: Terminology system to search.
          schema:
            $ref: '#/components/schemas/TerminologySystemCode'
        - name: q
          in: query
          required: false
          description: Optional search text.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of rows to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Matching terminology entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerminologyItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/terminology/resolve:
    get:
      tags:
        - Network
      operationId: resolveNetworkTerminology
      summary: Resolve a terminology code through the paired home-base data plane
      description: |
        Returns the same global terminology resolve shape exposed by the host
        `/api/v1/terminology/resolve` read route. This paired route requires
        the `network.catalogs.readonly` capability plus a valid paired client
        credential and operator session cookie. Terminology catalog data is
        global reference data and is not filtered by ambulatory scope.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: system
          in: query
          required: true
          description: Terminology system to resolve.
          schema:
            $ref: '#/components/schemas/TerminologySystemCode'
        - name: code
          in: query
          required: true
          description: Code to resolve within the requested terminology system.
          schema:
            type: string
      responses:
        '200':
          description: Resolved terminology entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminologyItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/terminology/systems:
    get:
      tags:
        - Network
      operationId: listNetworkTerminologySystems
      summary: List terminology systems through the paired home-base data plane
      description: |
        Returns the same global terminology registry shape exposed by the host
        `/api/v1/terminology/systems` read route. This paired route requires
        the `network.catalogs.readonly` capability plus a valid paired client
        credential and operator session cookie. Terminology catalog data is
        global reference data and is not filtered by ambulatory scope.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      responses:
        '200':
          description: Terminology registry entries exposed by the home-base node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerminologyRegistryEntry'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/service-prescriptions:
    get:
      tags:
        - Network
      operationId: listNetworkServicePrescriptions
      summary: List service prescriptions through the paired home-base data plane
      description: |
        Lists service prescriptions for a patient in the paired client's
        effective ambulatory scope. This route requires
        `network.replica.readonly-service-prescriptions`.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: patientId
          in: query
          required: true
          description: Patient identifier scoped to the paired client's ambulatory.
          schema:
            type: string
      responses:
        '200':
          description: Scoped service prescriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePrescriptionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Network
      operationId: createNetworkServicePrescription
      summary: Create service prescription through the paired boundary
      description: |
        Creates a service prescription for a patient in the paired client's
        effective ambulatory scope. This route requires
        `network.replica.write-service-prescriptions`.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePrescriptionCreateRequest'
      responses:
        '201':
          description: Created service prescription identifier and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedVersionedResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NetworkDataPlaneUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/network/service-prescriptions/{id}:
    put:
      tags:
        - Network
      operationId: updateNetworkServicePrescription
      summary: Update service prescription through the paired boundary
      description: |
        Applies a compare-on-write update to a service prescription in scope.
        `version` is required and stale versions return `VERSION_CONFLICT`.
        This route requires `network.replica.write-service-prescriptions`.
      security:
        - pairedClientId: []
          pairedClientToken: []
          sessionCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service prescription identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePrescriptionMutationRequest'
      responses:
        '200':
          description: Service prescription updated.
          content:
            application/json:
              schema:
