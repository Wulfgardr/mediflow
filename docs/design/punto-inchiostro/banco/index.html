<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediFlow banco di design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
</head><body>
<style>
/* Layout: barra di comando in alto, a sinistra il dispositivo in scala reale, a destra il pannello di regolazione dei token. */
:root{--sh-bg:#f1f2f4;--sh-panel:#fff;--sh-ink:#17191c;--sh-muted:#5b6470;--sh-line:#d6dae0;--sh-accent:#2346b0;--sh-on:#fff;--sh-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--sh-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh-bg:#0f1114;--sh-panel:#191c20;--sh-ink:#e8ebee;--sh-muted:#9aa3ae;--sh-line:#30353c;--sh-accent:#9db4ff;--sh-on:#0f1114;color-scheme:dark}}
:root[data-theme="dark"]{--sh-bg:#0f1114;--sh-panel:#191c20;--sh-ink:#e8ebee;--sh-muted:#9aa3ae;--sh-line:#30353c;--sh-accent:#9db4ff;--sh-on:#0f1114;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--sh-bg);color:var(--sh-ink);font:14px/1.45 var(--sh-font);margin:0}
button,select,input{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--sh-panel);border-bottom:1px solid var(--sh-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar h1{font-size:14px;font-weight:650;margin:0}
.bar label{display:flex;gap:6px;align-items:center;color:var(--sh-muted);font-size:13px}
.bar select,.bar .tg{min-height:36px;border:1px solid var(--sh-line);border-radius:8px;background:var(--sh-panel);padding:0 10px}
.bar .tg{cursor:pointer}.bar .tg[aria-pressed="true"]{background:var(--sh-accent);color:var(--sh-on);border-color:var(--sh-accent)}
.bar :focus-visible,.tun :focus-visible{outline:2px solid var(--sh-accent);outline-offset:2px}
.wrap{padding-block:14px 40px;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.wrap.t{grid-template-columns:minmax(0,1fr) 300px}
.cap{color:var(--sh-muted);margin:0 0 10px;max-width:90ch}.cap b{color:var(--sh-ink)}
.fit{position:relative;overflow:hidden}
.dev{transform-origin:0 0;position:absolute;left:0;top:0;border-radius:var(--dr,10px);overflow:hidden;box-shadow:0 0 0 1px var(--sh-line),0 20px 50px -30px rgba(0,0,0,.5);container:dev/size}
.tun{background:var(--sh-panel);border:1px solid var(--sh-line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.tun h2{font-size:13px;margin:0}
.tun .r{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;font-size:12.5px;color:var(--sh-muted)}
.tun input[type=color]{width:100%;height:30px;padding:0;border:1px solid var(--sh-line);border-radius:6px;background:none}
.tun input[type=number]{width:100%;height:30px;border:1px solid var(--sh-line);border-radius:6px;background:var(--sh-panel);padding:0 6px}
.tun textarea{width:100%;height:170px;font:11px/1.4 var(--sh-mono);border:1px solid var(--sh-line);border-radius:6px;background:var(--sh-bg);color:var(--sh-ink);padding:8px}
.tun button{min-height:36px;border:1px solid var(--sh-line);border-radius:8px;background:var(--sh-panel);cursor:pointer}
@media (max-width:900px){.wrap.t{grid-template-columns:1fr}.tun{position:static;max-height:none}}

/* ═════ applicazione ═════ */
.app{--penombra:#e8eaee;--piano:#fff;--filetto:#dfe2e7;--filetto2:#c9ced6;--ink:#14161a;--fresh:#2346b0;--matita:#5f6878;--sec:#555e6b;--freshbg:#f3f6fd;--freshln:#d9e0f3;--hov:#f5f6f8;--sel:#eef2fb;--warn:#8a5a1c;--crit:#a33a2f;--ok:#3f5a49;--soglia:#14161a;--sogliatx:#fff;
 --row:36px;--rc:10px;--rp:16px;--prosa:17px;--reg:13.5px;--tposa:520ms;--tdry:1500ms;--side:176px;
 --f:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,"Noto Sans",sans-serif;--s:"Newsreader",Georgia,"Times New Roman",serif;--m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 width:100%;height:100%;display:flex;flex-direction:column;background:var(--penombra);color:var(--ink);font:var(--reg)/1.4 var(--f);-webkit-font-smoothing:antialiased;position:relative}
.app.gr{--penombra:#101216;--piano:#1a1d22;--filetto:#2a2e35;--filetto2:#3b414b;--ink:#e9ecef;--fresh:#9db4ff;--matita:#9aa3b0;--sec:#a3acb8;--freshbg:#1d2333;--freshln:#2f3a5c;--hov:#20242a;--sel:#232a3d;--warn:#d9a75f;--crit:#f08a7d;--ok:#8fbf9f;--soglia:#e9ecef;--sogliatx:#14161a}
.app.touch{--row:44px}
.app button{cursor:pointer;font:inherit;color:inherit}
.app :focus-visible{outline:2px solid var(--fresh);outline-offset:2px}
.app.rm *,.app.rm *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.app *,.app *::before{animation:none!important;transition:none!important}}
.app.tg button,.app.tg input,.app.tg select,.app.tg textarea,.app.tg [role=switch]{outline:1px dashed #d0428a;outline-offset:1px}
.dot{display:inline-block;width:.44em;height:.44em;border-radius:50%;background:var(--fresh);margin-right:.5em;flex:none}
.dot.dry{background:var(--ink)}.dot.pen{background:transparent;box-shadow:inset 0 0 0 1.5px var(--matita)}
.dot.set{animation:settle var(--tposa) cubic-bezier(.3,1.5,.5,1) both}
.dot.lis{background:transparent;box-shadow:inset 0 0 0 1.5px var(--matita);animation:lis 1.4s ease-in-out infinite}
@keyframes settle{0%{transform:translateY(-.7em) scale(1.35);background:var(--fresh)}60%{transform:none;background:var(--fresh)}100%{background:var(--ink)}}
@keyframes lis{50%{box-shadow:inset 0 0 0 .22em var(--matita)}}
.wm{font-family:var(--s);font-size:21px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.wm .dot,h2 .dot,.big .dot{width:.24em;height:.24em;margin:0 0 0 .06em}
.fresh{color:var(--fresh)}.pencil{color:var(--matita);text-decoration:underline dashed;text-decoration-thickness:1px;text-underline-offset:4px}
.dries{animation:dry var(--tdry) ease-out both}@keyframes dry{from{color:var(--fresh)}to{color:var(--ink)}}
.w{color:var(--warn)}.cr{color:var(--crit)}.okc{color:var(--ok)}
.c{font-family:var(--m);font-size:.89em;color:var(--sec);white-space:nowrap}.v{font-family:var(--m);font-weight:500;white-space:nowrap}.r{text-align:right}.num{font-variant-numeric:tabular-nums}
.grow{flex:1}.sr{position:absolute;left:-9999px}
/* cornici di piattaforma */
.tb{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;flex:none;color:var(--sec);font-size:12.5px}
.tb .tl{display:flex;gap:7px}.tb .tl i{width:12px;height:12px;border-radius:50%;background:var(--filetto2)}
.tb .cb{margin-left:auto;display:flex;gap:18px;font-size:13px}
.pf-linux .tb{justify-content:center;font-weight:600;color:var(--ink);position:relative;background:var(--piano);border-bottom:1px solid var(--filetto)}
.pf-linux .tb .cb{position:absolute;right:12px}
.pf-win .tb{height:34px}
.ios-st{display:flex;justify-content:space-between;padding:10px 26px 2px;font-weight:600;font-size:14px;flex:none}
.shell{flex:1;min-height:0;display:flex}
.side{width:var(--side);flex:none;padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side .wm{padding:2px 10px 14px}
.side button{border:0;background:transparent;text-align:left;height:var(--row);padding:0 10px;border-radius:var(--rc);color:var(--sec);flex:none}
.side button[aria-current]{background:color-mix(in srgb,var(--piano) 80%,transparent);color:var(--ink);font-weight:600}
.pf-win .side button[aria-current]{box-shadow:inset 3px 0 0 var(--fresh);border-radius:4px}
.side .sp{flex:1}
.main{flex:1;min-width:0;display:flex;padding:10px 10px 0 0}
.pf-mac .main,.pf-win .main,.pf-linux .main{padding-top:0}
.plane{flex:1;min-width:0;background:var(--piano);border-radius:var(--rp) var(--rp) 0 0;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent),0 18px 44px -26px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow:auto}
.tabs{display:none;flex:none;background:color-mix(in srgb,var(--piano) 86%,transparent);border-top:1px solid var(--filetto);padding:4px 6px calc(4px + var(--home,0px))}
.tabs button{flex:1;border:0;background:transparent;min-height:48px;font-size:11px;color:var(--sec);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button[aria-current]{color:var(--fresh);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
/* testate e controlli */
.hd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 22px 12px;border-bottom:1px solid var(--filetto);flex:none}
.hd h2{font-family:var(--s);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:-.012em;margin:0}
.facts{color:var(--sec);font-family:var(--m);font-size:12px}
.alg{color:var(--crit);border:1px solid var(--crit);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.btn{height:var(--row);padding:0 14px;border-radius:var(--rc);border:1px solid var(--filetto2);background:var(--piano);font-weight:500;transition:transform 80ms;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}.btn.p{background:var(--fresh);border-color:var(--fresh);color:var(--piano)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.inp{height:var(--row);border:1px solid var(--filetto2);border-radius:var(--rc);padding:0 12px;background:var(--piano);color:var(--ink);font:inherit;min-width:0}
.sgm{display:inline-flex;background:var(--penombra);border-radius:var(--rc);padding:2px;max-width:100%;overflow-x:auto}
.sgm button{border:0;background:transparent;height:calc(var(--row) - 4px);padding:0 11px;border-radius:calc(var(--rc) - 2px);color:var(--sec);white-space:nowrap;transition:background 160ms}
.sgm button[aria-pressed="true"]{background:var(--piano);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.16)}
.body{padding:4px 22px 18px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start}
.body.one{grid-template-columns:minmax(0,1fr)}
h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--sec);font-weight:600;margin:14px 0 0;padding-bottom:6px;border-bottom:1px solid var(--filetto2);display:flex;justify-content:space-between;gap:10px}
h3 span{font-family:var(--m);letter-spacing:0;text-transform:none;font-weight:400}
table{border-collapse:collapse;width:100%}
td,th{padding:7px 12px 7px 0;border-bottom:1px solid var(--filetto);text-align:left;vertical-align:baseline}
td:last-child,th:last-child{padding-right:0}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);font-weight:600;border-bottom-color:var(--filetto2)}
.en{display:grid;grid-template-columns:70px minmax(0,1fr);gap:0 14px;padding:12px 0;border-bottom:1px solid var(--filetto)}
.en .when{font-family:var(--m);font-size:12px;color:var(--sec);padding-top:2px}.en .ty{font-weight:600}
.en p,.prosa{font-family:var(--s);font-size:var(--prosa);line-height:1.45;margin:3px 0 0;max-width:64ch}
.en .by{font-family:var(--m);font-size:11px;color:var(--sec);margin-top:5px;display:flex;align-items:center}
.en.dim p{color:var(--sec)}
.en.live{background:var(--freshbg);margin:8px -12px 0;padding:12px;border-radius:12px;border-bottom:0;box-shadow:0 0 0 1px var(--freshln)}
.en.live textarea{border:0;background:transparent;font-family:var(--s);font-size:var(--prosa);line-height:1.45;min-height:190px;padding:0;color:var(--fresh);width:100%;resize:vertical}
.state{display:flex;align-items:center;font-weight:600;font-size:12.5px;gap:8px;flex-wrap:wrap}
.it{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--freshln)}
.it li{display:grid;grid-template-columns:14px 74px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--freshln);min-height:38px}
.it .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--sec);font-weight:600}
.it .mini,.mini{display:flex;gap:6px;flex-wrap:wrap}
.foot{flex:none;background:var(--piano);border-top:1px solid var(--filetto2);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot.cf{background:var(--soglia);color:var(--sogliatx);border-color:var(--soglia)}
.foot.cf .btn{background:transparent;color:var(--sogliatx);border-color:color-mix(in srgb,var(--sogliatx) 45%,transparent)}
.foot.cf .btn.p{background:var(--sogliatx);color:var(--soglia);border-color:var(--sogliatx)}
.foot .msg{flex:1;min-width:200px}.foot .msg b{font-family:var(--s);font-size:17px;font-weight:500;display:flex;align-items:center}
.foot .msg small{display:block;font-size:12.5px;opacity:.82}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--filetto);flex:none}
.filters h2{font-family:var(--s);font-weight:400;font-size:28px;margin:0 8px 0 0;line-height:1}
.lst{display:grid;grid-template-columns:minmax(0,1fr) 290px;flex:1;min-height:0}
.lst .tbw{overflow:auto;padding:0 22px}
.lst thead th{height:30px;padding-block:0}.lst tbody td{height:var(--row);padding-block:0}
.lst tbody tr{cursor:pointer}.lst tbody tr:hover{background:var(--hov)}.lst tbody tr.sel{background:var(--sel)}
.rowb{border:0;background:transparent;padding:0;text-align:left;height:var(--row);width:100%;font-family:var(--s);font-size:17px;display:flex;align-items:center}
.rowb .nod{width:.44em;margin-right:.5em;flex:none}
.insp{border-left:1px solid var(--filetto);padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--hov);overflow:auto}
.insp h4{font-family:var(--s);font-weight:400;font-size:22px;margin:0}
dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:5px 8px}dt{color:var(--sec)}dd{margin:0}
.leg{padding:8px 22px;color:var(--sec);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 18px;border-top:1px solid var(--filetto);flex:none}
.leg span{display:inline-flex;align-items:center}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.card .big{font-family:var(--s);font-size:40px;font-weight:400;line-height:1}
.opt{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--filetto2);border-radius:var(--rc);background:var(--piano)}
.sw{width:40px;height:24px;border-radius:999px;border:1px solid var(--filetto2);background:var(--penombra);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--piano);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left 160ms}
.sw::before{content:"";position:absolute;inset:-10px -2px}
.sw[aria-checked="true"]{background:var(--fresh);border-color:var(--fresh)}.sw[aria-checked="true"]::after{left:18px}
.setrow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--filetto);min-height:52px}
.setrow small{display:block;color:var(--sec)}
.two{display:grid;grid-template-columns:200px minmax(0,1fr);flex:1;min-height:0}
.two>nav{border-right:1px solid var(--filetto);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.two>nav button{border:0;background:transparent;text-align:left;height:var(--row);padding:0 10px;border-radius:var(--rc);color:var(--sec);flex:none}
.two>nav button[aria-current]{background:var(--sel);color:var(--ink);font-weight:600}
.two>nav b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);padding:10px 10px 4px}
.doc{background:var(--hov);border:1px solid var(--filetto);border-radius:8px;padding:16px;font-family:var(--m);font-size:12px;line-height:1.6;color:var(--sec);white-space:pre-wrap}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;border-bottom:1px solid var(--filetto2)}
.bars i{flex:1;background:var(--ink);opacity:.82;min-width:6px}.bars i.hi{background:var(--fresh);opacity:1}
.kp{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0}.kp div b{display:block;font-family:var(--m);font-size:24px;font-weight:500}.kp div span{color:var(--sec)}
.stt{padding:14px 0;border-bottom:1px solid var(--filetto);display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stt b{display:block}.stt span{color:var(--sec)}
.vp{margin-top:8px;border-top:1px solid var(--freshln);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.lv{display:flex;align-items:center;gap:3px;height:22px}.lv i{width:3px;background:var(--matita);border-radius:2px;animation:lv 900ms ease-in-out infinite}
@keyframes lv{50%{transform:scaleY(.35)}}
.vp textarea{border:1px dashed var(--matita);border-radius:8px;background:transparent;font-family:var(--s);font-size:var(--prosa);line-height:1.45;color:var(--matita);padding:8px;width:100%;min-height:96px;resize:vertical}
.cli{flex:1;background:#14161a;color:#e6e9ee;font-family:var(--m);font-size:13px;line-height:1.75;padding:18px 20px;white-space:pre-wrap;overflow:auto}
.cli .fr{color:#9db4ff}.cli .pn{color:#a3abb8}
.fold{display:none}
/* forme per piattaforma */
.pf-mac{--rc:8px;--rp:12px;--reg:13px}.pf-win{--rc:4px;--rp:8px;--reg:14px;--f:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
.pf-linux{--rc:6px;--rp:10px;--reg:14px;--f:"Adwaita Sans",Cantarell,"Noto Sans",system-ui,sans-serif}
.pf-ipad,.pf-iphone,.pf-duo,.pf-duoc{--rc:12px;--rp:18px;--reg:15px;--home:14px}
/* classi di larghezza: compatta sotto 700, media 700-1000, estesa oltre */
@container dev (max-width:1000px){
 .side{--side:150px}.body{gap:18px}.lst{grid-template-columns:minmax(0,1fr) 250px}.hide2{display:none}
}
@container dev (max-width:700px){
 .side,.tb.desk{display:none}.tabs{display:flex}.main{padding:0}.plane{border-radius:0;box-shadow:none}
 .body,.lst,.two{grid-template-columns:minmax(0,1fr)}.body{padding:0 16px 16px;gap:4px}.body.wr>div:first-child{order:2}
 .hd,.filters,.foot{padding-inline:16px}.lst .tbw{padding:0 16px}.insp,.two>nav.col{display:none}
 .hide,.hide2{display:none}.hd h2{font-size:26px}.en{grid-template-columns:minmax(0,1fr)}
 .it li{grid-template-columns:14px 74px minmax(0,1fr)}.it .mini{grid-column:2/-1}
 .two>nav{border-right:0;border-bottom:1px solid var(--filetto);flex-direction:row;overflow-x:auto}.two>nav b{display:none}.two>nav button{white-space:nowrap}
}
/* iPhone Duo aperto: due pagine ai lati della piega */
.pf-duo .fold{display:block;position:absolute;top:0;bottom:0;left:50%;width:1px;background:color-mix(in srgb,var(--ink) 14%,transparent);z-index:3;pointer-events:none}
.pf-duo .side{display:none}.pf-duo .tabs{display:flex}.pf-duo .main{padding:0}.pf-duo .plane{border-radius:0}
.pf-duo .body,.pf-duo .lst,.pf-duo .two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.pf-duo .body>div{padding:0 20px 14px}.pf-duo .body{padding:0}.pf-duo .insp{display:flex}.pf-duo .lst .tbw{padding:0 20px}
.pf-duo .hide,.pf-duo .hide2{display:none}
.pf-duo .hd,.pf-duo .filters,.pf-duo .foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 40px;padding-inline:20px}.pf-duo .hd .grow{display:none}.pf-duo .foot .mini,.pf-duo .foot>.btn{justify-self:start}.pf-duo .body.one{grid-template-columns:minmax(0,1fr)}.pf-duo .body.one>div{padding:0 20px 14px}
</style>

<div class="bar">
  <h1>MediFlow · banco di design</h1>
  <label for="scr">Schermata <select id="scr"></select></label>
  <label for="pf">Piattaforma <select id="pf"></select></label>

/* ───── cornice ───── */
function frame(inner,cur='Pazienti',bare=false){
 const p=S.pf,ios=['iphone','duoc','ipad','ipadp','duo'].includes(p);
 const tb=p==='mac'?`<div class="tb desk"><span class="tl"><i></i><i></i><i></i></span></div>`:p==='win'?`<div class="tb desk">MediFlow<span class="cb">─ ☐ ✕</span></div>`:p==='linux'?`<div class="tb desk">${cur}<span class="cb">✕</span></div>`:ios?`<div class="ios-st"><span>19:02</span><span>●●● ▮</span></div>`:'';
 const pfc={ipadp:'ipad'}[p]||p;
 const cls=`app pf-${pfc} ${PF[p][3]?'touch':''} ${S.gr?'gr':''} ${S.rm?'rm':''} ${S.tg?'tg':''}`;
 if(bare)return `<div class="${cls}">${tb}${inner}</div>`;
 return `<div class="${cls}">${tb}<div class="shell"><nav class="side" aria-label="Aree">${wm()}${NAV.map(n=>`<button ${n===cur?'aria-current="page"':''} data-go="${NAVK[n]}">${n}</button>`).join('')}<div class="sp"></div><button ${cur==='Impostazioni'?'aria-current="page"':''} data-go="impostazioni">Impostazioni</button><button data-go="sblocco">Blocca</button></nav><div class="main"><div class="plane">${inner}</div></div></div>
 <nav class="tabs" aria-label="Aree">${[['Pazienti','ppl','elenco'],['Agenda','cal','agenda'],['Diario','book','diario'],['Altro','more','impostazioni']].map(t=>`<button ${t[0]===cur||(t[0]==='Altro'&&!['Pazienti','Agenda','Diario'].includes(cur))?'aria-current="page"':''} data-go="${t[2]}">${IC[t[1]]}${t[0]}</button>`).join('')}</nav><i class="fold"></i></div>`}
const hd=(x='')=>`<div class="hd"><h2>${P.name}</h2><span class="facts">F · ${P.age} anni · ${P.born} · ${P.cf}</span><span class="alg">▲ ${P.allergy}</span><span class="grow"></span>${x}</div>`;
const secs=(cur)=>`<div class="filters" style="padding-block:8px"><div class="sgm" role="group" aria-label="Sezione">${[['Riepilogo','scheda'],['Terapie','terapie'],['Misure','misure'],['Documenti','documenti']].map(s=>`<button aria-pressed="${s[1]===cur}" data-go="${s[1]}">${s[0]}</button>`).join('')}</div></div>`;
function quadro(){const sv=S.w==='saved',dr=sv?'dries':'';
 const ther=P.ther.map((t,i)=>i===0&&sv?[t[0],'10 mg',t[2],t[3],t[4],1]:t);
 const meas=sv?[['Pressione arteriosa','142/84','mmHg','09/10','−6 sistolica dal 06/10','',1],...P.meas.slice(1)]:P.meas;
 return `<h3>Problemi <span>${P.prob.length}</span></h3><table>${P.prob.map(p=>`<tr><td class="c">${p[0]}</td><td>${p[1]}</td><td class="c r hide2">${p[2]}</td></tr>`).join('')}</table>
 <h3>Terapie attive <span>${ther.length}</span></h3><table>${ther.map(t=>`<tr class="${t[5]?dr:''}"><td><b>${t[0]}</b> <span class="v">${t[1]}</span></td><td>${t[2]}</td><td class="c r hide2">ATC ${t[3]}</td></tr>`).join('')}</table>
 <h3>Misure recenti <span>ultime 4</span></h3><table>${meas.map(m=>`<tr class="${m[6]?dr:''}"><td>${m[0]}</td><td class="v r num">${m[1]} <span class="c">${m[2]}</span></td><td class="c">${m[3]}</td><td class="c hide2">${stl(m[4],m[5])}</td></tr>`).join('')}</table>
 <h3>Controlli aperti <span>${P.due.length}</span></h3><table>${P.due.map(d=>`<tr><td>${d[0]}</td><td class="r">${stl(d[1],d[2])}</td></tr>`).join('')}</table>`}
const en=(d,c='')=>`<article class="en ${c}"><div class="when">${d.d} ${d.m}<br>${d.h}</div><div><span class="ty">${d.t}</span> <span class="c">· ${d.w}</span><p>${nl(d.x)}</p><div class="by"><i class="dot dry" aria-hidden="true"></i>Registrata da Dr. demo</div></div></article>`;
function wmsg(n){return{draft:['Bozza non registrata',n+' elementi pronti per la scheda di '+P.name+'.'+(S.prop==='pencil'?' Una proposta a matita resta fuori finché non la accetti.':'')],
 confirm:['Registrare nella scheda di '+P.name+', '+P.age+' anni?','1 voce di diario, '+(n-2)+(n-2>1?' misure':' misura')+', 1 modifica di terapia. La scrittura è unica: o tutto o niente.'],
 saving:['Registrazione in corso','Attendi la conferma prima di chiudere.'],saved:['Registrata il 9 ottobre 2026 alle 19:02',n+' elementi scritti e tracciati a nome di Dr. demo.'],
 error:['Non registrata. Nulla è stato scritto.','La scheda è stata modificata da un\'altra postazione alle 19:01. La bozza è intatta: rileggi la scheda e riprova.']}[S.w]}
function wbtns(n){return{draft:`<button class="btn p" data-w="confirm">Registra ${n} elementi</button>`,confirm:`<button class="btn" data-w="draft">Torna alla bozza</button><button class="btn p" data-w="save">Conferma e registra</button>`,saving:`<button class="btn p" disabled>Registrazione…</button>`,saved:`<button class="btn" data-go="scheda">Torna alla scheda</button>`,error:`<button class="btn" data-go="scheda">Rileggi la scheda</button><button class="btn p" data-w="save">Riprova</button>`}[S.w]}
function voice(){const v=S.v;const b=(t,s,p='',ic='')=>`<button class="btn ${p}" data-v="${s}">${ic}${t}</button>`;
 const m={info:`<span>L'audio viene elaborato solo su questo computer e non viene salvato. La trascrizione arriva a matita: resta una proposta finché non la porti nella voce. Informa il paziente prima di cominciare.</span><div class="mini">${b('Annulla','off')}${b('Consenti microfono e continua','pronto','p')}</div>`,
 pronto:`<span>Microfono e lingua italiana sono pronti. L'avvio resta manuale. Durata massima 90 minuti.</span><div class="mini">${b('Annulla','off')}${b('Ascolta la visita','ascolto','p',IC.mic)}</div>`,

 usata:`<div class="state fresh"><i class="dot"></i>Trascrizione portata nella voce. Rivedila prima di registrare.</div><div class="mini">${b('Nuovo ascolto','pronto')}</div>`,
 negato:`<span class="cr">✕ Accesso al microfono negato. L'ascolto è chiuso e non verrà ritentato.</span><div class="mini">${b('Chiudi','off')}<button class="btn">Apri le impostazioni del microfono</button></div>`,
 assente:`<span>Su questa piattaforma l'ascolto non è disponibile: il comando non compare e questa riga non si vede. Oggi esiste solo su Mac con macOS 26. Scegli macOS per vedere il flusso.</span>`}[v];

const R={
 sblocco(){return frame(`<div class="center"><form class="card" onsubmit="return false"><div class="big">MediFlow<i class="dot dry"></i></div><span style="color:var(--sec)">Ambulatorio locale · Dr. demo</span><label for="pin" class="sr">PIN operatore</label><input class="inp" id="pin" type="password" placeholder="PIN operatore" style="height:44px"><button class="btn p" data-go="elenco" style="height:44px;justify-content:center">Sblocca</button></form></div>`,'',true)},
 avvio(){return frame(`<div class="center"><div class="card" style="width:min(520px,100%)"><div class="big" style="font-size:32px">Come vuoi lavorare?</div><span style="color:var(--sec)">Domanda 1 di 3. Puoi usare la cartella senza AI e cambiare risposta dalle impostazioni.</span>${['Consultare e compilare cartelle','Organizzare il lavoro della postazione','Preparare attività ripetitive da rivedere'].map((o,i)=>`<label class="opt" for="o${i}"><input type="radio" name="o" id="o${i}" ${i===0?'checked':''}>${o}</label>`).join('')}<div class="mini" style="justify-content:space-between"><button class="btn" data-go="elenco">Apri la cartella senza configurare</button><button class="btn p">Continua</button></div></div></div>`,'',true)},
 elenco(){const s=L[S.sel];const mk=i=>i===0&&S.w!=='saved'?'<i class="dot" title="Bozza non registrata"></i><span class="sr">Bozza non registrata. </span>':i===2?'<i class="dot pen" title="Proposta da rivedere"></i><span class="sr">Proposta da rivedere. </span>':'<i class="nod"></i>';
  return frame(`<div class="filters"><h2>Pazienti</h2><input class="inp" id="q" placeholder="Cerca per nome, codice fiscale o diagnosi" aria-label="Cerca" style="flex:1 1 200px"><div class="sgm"><button aria-pressed="true">In carico · 14</button><button aria-pressed="false">Da rivedere · 4</button><button aria-pressed="false">Archivio</button></div><button class="btn p">Nuova scheda</button></div>
  <div class="lst"><div class="tbw"><table><thead><tr><th>Paziente</th><th class="hide">Età</th><th class="hide hide2">Problema principale</th><th class="hide">Ultimo contatto</th><th>Da fare</th></tr></thead><tbody>${L.map((r,i)=>`<tr class="${i===S.sel?'sel':''}" data-sel="${i}"><td><button class="rowb" data-row data-open="${i}">${mk(i)}${r[0]}</button></td><td class="c num hide">${r[1]}</td><td class="hide hide2">${r[2]}</td><td class="c num hide">${r[3]}</td><td>${stl(r[4],r[5])}</td></tr>`).join('')}</tbody></table></div>
  <aside class="insp" aria-label="Anteprima"><h4>${s[0]}</h4><dl><dt>Età</dt><dd>${s[1]} anni</dd><dt>Problema</dt><dd>${s[2]}</dd><dt>Ultimo contatto</dt><dd class="c">${s[3]}/2026</dd><dt>Da fare</dt><dd>${stl(s[4],s[5])}</dd></dl><button class="btn p" data-go="scheda">Apri la scheda</button><span class="c">↑ ↓ per scorrere · Invio per aprire</span></aside></div>
  <div class="leg"><span><i class="dot pen"></i>Proposta da rivedere</span><span><i class="dot"></i>Bozza tua, non registrata</span></div>`)},
 scheda(){return frame(hd(`<button class="btn">Azioni</button><button class="btn p" data-go="scrittura">Nuova voce</button>`)+secs('scheda')+`<div class="scroll"><div class="body"><div>${quadro()}</div><div><h3>Diario <span>${diary().length} voci</span></h3>${diary().map(d=>en(d)).join('')}</div></div></div>`)},
 scrittura(withVoice){const sv=S.w==='saved',ed=S.w==='draft'||S.w==='error',n=ITEMS.length+(S.prop==='acc'?1:0),m=wmsg(n);
  const lis=withVoice&&S.v==='ascolto';
  const prop=S.prop==='rej'?'':S.prop==='acc'?`<li><i class="dot"></i><span class="k">Misura</span><span class="fresh">Frequenza cardiaca media 74 bpm</span><span class="c hide">dal referto Holter</span></li>`:`<li><i class="dot pen"></i><span class="k">Proposta</span><span class="pencil">Frequenza cardiaca media 74 bpm, dal referto Holter dell'8 ottobre</span><span class="mini">${ed?`<button class="btn" data-prop="rej">Scarta</button><button class="btn" data-prop="acc">Accetta</button>`:''}</span></li>`;
  const mic=ed&&S.pf==='mac'?(lis?`<button class="btn" data-v="finale">${IC.stop}Ferma l'ascolto</button>`:`<button class="btn" data-v="info" ${withVoice?'':'data-go="voce"'}>${IC.mic}Ascolta la visita</button>`):'';
  const live=sv?en(NEW).replace('<p>','<p class="dries">').replace('class="dot dry"','class="dot set"').replace('Registrata da','Registrata alle 19:02 da'):
  `<article class="en live"><div class="when">09 ott<br>19:00</div><div><div class="state"><span class="fresh" style="display:flex;align-items:center"><i class="dot"></i>${S.w==='error'?'Bozza intatta':'Bozza non registrata'}</span><span class="grow"></span>${mic}</div><div style="margin-top:4px"><span class="ty">Visita</span> <span class="c">· Ambulatorio</span></div>
  <textarea id="x" aria-label="Resoconto clinico" ${ed?'':'readonly'}>${e(NEW.x)}</textarea>${withVoice?voice():''}<ul class="it">${ITEMS.map(i=>`<li><i class="dot"></i><span class="k">${i[0]}</span><span class="fresh">${i[1]}</span><span></span></li>`).join('')}${prop}</ul></div></article>`;
  const dot=sv?'<i class="dot set"></i>':S.w==='error'?'<span class="cr">✕&nbsp;</span>':'<i class="dot"></i>';
  return frame(hd()+`<div class="scroll"><div class="body wr"><div>${quadro()}</div><div><h3>Diario <span>${P.diary.length+1} voci</span></h3>${live}${P.diary.map(d=>en(d,sv?'':'dim')).join('')}</div></div></div>
