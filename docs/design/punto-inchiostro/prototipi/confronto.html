<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediFlow direzioni estetiche</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
</head><body>
<style>
/* Layout: una barra di confronto fissa in alto, sotto un unico palco che ospita la stessa schermata in tre lingue diverse. */
:root{
  --sh-bg:#f1f2f4; --sh-panel:#ffffff; --sh-ink:#17191c; --sh-muted:#5b6470; --sh-line:#d6dae0; --sh-accent:#2f5373; --sh-on:#ffffff;
  --sh-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sh-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh-bg:#111316;--sh-panel:#1a1d21;--sh-ink:#e8ebee;--sh-muted:#98a2ad;--sh-line:#30353c;--sh-accent:#9bbbd8;--sh-on:#10151a;color-scheme:dark}}
:root[data-theme="dark"]{--sh-bg:#111316;--sh-panel:#1a1d21;--sh-ink:#e8ebee;--sh-muted:#98a2ad;--sh-line:#30353c;--sh-accent:#9bbbd8;--sh-on:#10151a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--sh-bg);color:var(--sh-ink);font:14px/1.45 var(--sh-font);margin:0}
button{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--sh-panel);border-bottom:1px solid var(--sh-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar h1{font-size:14px;font-weight:650;margin:0;letter-spacing:-.01em}
.bar .syn{font:11px var(--sh-mono);color:var(--sh-muted);border:1px solid var(--sh-line);border-radius:4px;padding:2px 6px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--sh-line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;min-height:36px;cursor:pointer;border-right:1px solid var(--sh-line);color:var(--sh-muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sh-accent);color:var(--sh-on);font-weight:600}
.seg button:focus-visible,.chk:focus-within{outline:2px solid var(--sh-accent);outline-offset:2px}
.chk{display:flex;gap:6px;align-items:center;color:var(--sh-muted);font-size:13px}
.wrap{padding-block:16px 48px;padding-inline:16px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.note{color:var(--sh-muted);max-width:78ch;margin:0}
.note b{color:var(--sh-ink)}
.frame{container:frame/inline-size;margin:0 auto;width:100%;border:1px solid var(--sh-line);border-radius:10px;overflow:hidden;background:#fff}
.frame.m{width:390px;max-width:100%}
.frame>.d{min-height:820px}
.oggi{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.oggi img{width:100%;border:1px solid var(--sh-line);border-radius:10px;display:block}
.oggi ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px}
.oggi h2,.cmp h2{font-size:16px;margin:0 0 10px}
.cmp{background:var(--sh-panel);border:1px solid var(--sh-line);border-radius:10px;padding:18px}
.cmp .tw{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;min-width:760px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--sh-line)}
.cmp thead th{border-top:0;font-size:12px;color:var(--sh-muted);font-weight:600}
.cmp tbody th{width:130px;color:var(--sh-muted);font-weight:500}
.cmp p{max-width:80ch}
.cmp a{color:var(--sh-accent)}
@media (max-width:820px){.oggi{grid-template-columns:1fr}}

/* ───────── elementi comuni ai tre prototipi ───────── */
.d{position:relative;color:var(--ink);background:var(--bg);font-family:var(--f);-webkit-font-smoothing:antialiased}
.d button{cursor:pointer}
.d :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.d .num{font-variant-numeric:tabular-nums}
.d textarea{font:inherit;color:inherit;width:100%;resize:vertical;background:transparent}
.d .sr{position:absolute;left:-9999px}
.sem-warn{color:#8a5a1c}.sem-crit{color:#a33a2f}.sem-ok{color:#3f5a49}
@media (prefers-reduced-motion:reduce){.d *,.d *::before,.d *::after{animation:none!important;transition:none!important}}

/* ═════════ A · STRUMENTO ═════════ banco calibrato: rail, piani bianchi, filetti, mono per i dati */
.dA{--bg:#f3f5f7;--pl:#ffffff;--ink:#15181c;--mut:#566170;--line:#dde2e8;--line2:#c6ced7;--acc:#2c5475;--accbg:#e8eff6;--focus:#2c5475;--f:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;--m:"IBM Plex Mono",ui-monospace,monospace;--h:36px;font-size:13px;line-height:1.4;display:grid;grid-template-columns:184px minmax(0,1fr)}
@media (pointer:coarse){.dA{--h:44px}}
.dA .rail{background:#e9edf1;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.dA .rail .brand{font-weight:600;padding:6px 10px 14px;letter-spacing:-.01em}
.dA .rail button{border:0;background:transparent;text-align:left;height:var(--h);padding:0 10px;border-radius:6px;color:var(--mut)}
.dA .rail button[aria-current]{background:var(--pl);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.dA .rail .sp{flex:1}
.dA .main{min-width:0;display:flex;flex-direction:column}
.dA .top{background:var(--pl);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.dA .top h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.015em}
.dA .facts{color:var(--mut);font-family:var(--m);font-size:12px}
.dA .alg{border:1px solid #a33a2f;color:#a33a2f;border-radius:3px;padding:1px 6px;font-size:12px;font-weight:500}
.dA .grow{flex:1}
.dA .btn{height:var(--h);padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--pl);font-weight:500}
.dA .btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.dA .btn[disabled]{opacity:.55;cursor:default}
.dA .body{padding:14px 18px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start}
.dA .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.dA .fr{background:var(--pl);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dA .fr>header{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);background:#f8f9fb}
.dA .fr h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0;font-weight:600}
.dA .fr header span{font-family:var(--m);font-size:11px;color:var(--mut)}
.dA table{border-collapse:collapse;width:100%}
.dA td,.dA th{padding:7px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:baseline}
.dA tr:first-child td{border-top:0}
.dA .c{font-family:var(--m);font-size:12px;color:var(--mut);white-space:nowrap}
.dA .v{font-family:var(--m);font-weight:500;white-space:nowrap}
.dA .r{text-align:right}
.dA .dia{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0 12px;padding:10px 12px;border-top:1px solid var(--line)}
.dA .dia:first-of-type{border-top:0}
.dA .dia .when{font-family:var(--m);font-size:12px;color:var(--mut)}
.dA .dia .ty{font-weight:600}
.dA .dia p{margin:2px 0 0;max-width:68ch}
.dA .dia .by{font-family:var(--m);font-size:11px;color:var(--mut);margin-top:4px}
.dA .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;background:var(--pl);border-bottom:1px solid var(--line)}
.dA .inp{height:var(--h);border:1px solid var(--line2);border-radius:6px;padding:0 10px;background:var(--pl);font:inherit;color:inherit;min-width:0}
.dA .sgm{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.dA .sgm button{border:0;background:var(--pl);height:calc(var(--h) - 2px);padding:0 10px;color:var(--mut)}
.dA .sgm button[aria-pressed="true"]{background:var(--accbg);color:var(--acc);font-weight:600}
.dA .lst{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;flex:1}
.dA .lst .tb{overflow-x:auto;background:var(--pl)}
.dA .lst thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:600;border-top:0;border-bottom:1px solid var(--line2);background:#f8f9fb;height:30px;padding-block:0}
.dA .lst tbody td{height:var(--h);padding-block:0;border-top:1px solid var(--line)}
.dA .lst tbody tr{cursor:pointer}
.dA .lst tbody tr:hover{background:#f6f8fa}
.dA .lst tbody tr.sel{background:var(--accbg);box-shadow:inset 2px 0 0 var(--acc)}
.dA .rowb{border:0;background:transparent;padding:0;font-weight:500;text-align:left;height:var(--h);width:100%}
.dA .insp{border-left:1px solid var(--line);background:#f8f9fb;padding:14px;display:flex;flex-direction:column;gap:12px}
.dA .insp h4{margin:0;font-size:15px}
.dA .insp dl{margin:0;display:grid;grid-template-columns:92px 1fr;gap:4px 8px}
.dA .insp dt{color:var(--mut)} .dA .insp dd{margin:0}
.dA .st{font-size:12px;font-weight:500;white-space:nowrap}
.dA .ed{padding:12px;display:flex;flex-direction:column;gap:10px}
.dA .ed .meta{display:flex;flex-wrap:wrap;gap:8px}
.dA .ed textarea{border:1px solid var(--line2);border-radius:6px;padding:10px;min-height:250px;line-height:1.55;background:var(--pl)}
.dA .wr{list-style:none;margin:0;padding:0}
.dA .wr li{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}
.dA .wr li:first-child{border-top:0}
.dA .wr .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:600;padding-top:1px}
.dA .foot{position:sticky;bottom:0;margin-top:auto;background:var(--pl);border-top:1px solid var(--line2);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dA .foot.cf{background:#15181c;color:#fff;border-color:#15181c}
.dA .foot.cf .btn{background:transparent;color:#fff;border-color:#69727d}
.dA .foot.cf .btn.p{background:#fff;color:#15181c;border-color:#fff}
.dA .foot .msg{flex:1;min-width:220px}
.dA .foot .msg small{display:block;font-family:var(--m);font-size:11px;opacity:.75}
.dA.site{display:block;background:var(--pl)}
.dA .snav{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);color:var(--mut)}
.dA .snav b{color:var(--ink);margin-right:8px}
.dA .hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;padding:56px 28px 40px;align-items:center}
.dA .hero h2{font-size:46px;line-height:1.04;letter-spacing:-.03em;font-weight:600;margin:0 0 18px}
.dA .hero p{font-size:16px;color:#333b45;max-width:46ch;margin:0 0 10px}
.dA .cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.dA .cta .btn{height:44px;padding:0 16px}
.dA .spec{border-top:1px solid var(--line2);margin:0 28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.dA .spec div{padding:16px 16px 28px 0;border-right:1px solid var(--line);padding-left:16px}
.dA .spec div:first-child{padding-left:0}.dA .spec div:last-child{border-right:0}
.dA .spec dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.dA .spec dd{margin:6px 0 0;font-size:15px}
.dA .fig{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:0 18px 40px -24px rgba(21,24,28,.35)}
@container frame (max-width:900px){
  .dA{grid-template-columns:1fr}
  .dA .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px}
  .dA .rail .brand{padding:10px 10px} .dA .rail .sp{display:none}
  .dA .rail button{white-space:nowrap;height:44px}
  .dA .body,.dA .lst,.dA .hero{grid-template-columns:1fr}
  .dA .insp{border-left:0;border-top:1px solid var(--line)}
  .dA .hide{display:none}
  .dA .hero{padding:32px 16px}.dA .hero h2{font-size:34px}
  .dA .spec{grid-template-columns:1fr 1fr;margin:0 16px}.dA .snav{padding:12px 16px}
  .dA .btn,.dA .inp{height:44px}.dA .lst tbody td,.dA .rowb{height:44px}
}

/* ═════════ B · REGISTRO ═════════ pagina clinica: serif per la voce, filetti, data in margine, niente scatole */
.dB{--bg:#fbfbfa;--ink:#121212;--mut:#585858;--line:#d8d8d4;--focus:#121212;--f:"Hanken Grotesk",-apple-system,"Segoe UI",sans-serif;--s:"Newsreader",Georgia,"Times New Roman",serif;--m:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;line-height:1.45}
.dB .mast{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;padding:0 40px;border-bottom:2px solid var(--ink);min-height:52px}
.dB .mast b{font-family:var(--s);font-size:19px;font-weight:500;margin-right:14px}
.dB .mast button{border:0;background:transparent;min-height:44px;padding:0 2px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-2px}
.dB .mast button[aria-current]{color:var(--ink);font-weight:600}
.dB .mast .grow{flex:1}
.dB .pg{max-width:1180px;margin:0 auto;padding:34px 40px 60px}
.dB .who{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--ink)}
.dB .who h2{font-family:var(--s);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.015em;margin:0 0 8px}
.dB .who .facts{color:var(--mut)} .dB .who .facts .mono{font-family:var(--m);font-size:12.5px}
.dB .alg{color:#a33a2f;font-weight:600}
.dB .btn{min-height:44px;padding:0 18px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-weight:500}
.dB .btn.p{background:var(--ink);color:#fff}
.dB .btn[disabled]{opacity:.5;cursor:default}
.dB .acts{display:flex;gap:8px;flex-wrap:wrap}
.dB .two{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:56px;margin-top:26px;align-items:start}
.dB h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin:0;padding-bottom:8px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.dB h3 span{color:var(--mut);font-weight:400;letter-spacing:0;text-transform:none}
.dB .ent{display:grid;grid-template-columns:84px minmax(0,1fr);gap:0 22px;padding:18px 0;border-bottom:1px solid var(--line)}
.dB .ent .day{font-family:var(--s);font-size:38px;line-height:.95}
.dB .ent .mo{color:var(--mut);font-size:12px;margin-top:4px}
.dB .ent .ty{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.dB .ent .ty span{color:var(--mut);font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px}
.dB .ent p{font-family:var(--s);font-size:18px;line-height:1.5;margin:6px 0 0;max-width:62ch}
.dB .side{display:flex;flex-direction:column;gap:26px}
.dB .rl{list-style:none;margin:0;padding:0}
.dB .rl li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.dB .rl .n{font-family:var(--s);font-size:17px}
.dB .rl small{display:block;color:var(--mut);font-size:12.5px;font-family:var(--f)}
.dB .rl .v{font-family:var(--m);font-size:13px;white-space:nowrap;text-align:right}
.dB .rl .v small{font-family:var(--m);font-size:11px}
.dB .tools{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--ink)}
.dB .tools h2{font-family:var(--s);font-weight:400;font-size:44px;line-height:1;margin:0}
.dB .srch{min-height:44px;border:0;border-bottom:1px solid var(--ink);background:transparent;font:inherit;color:inherit;width:300px;max-width:100%;padding:0 2px}
.dB .ix{list-style:none;margin:0 0 26px;padding:0}
.dB .ix li{border-bottom:1px solid var(--line)}
.dB .ix button{display:grid;grid-template-columns:34px minmax(0,3fr) minmax(0,4fr) 110px 150px;gap:16px;align-items:baseline;width:100%;min-height:48px;padding:8px 0;border:0;background:transparent;text-align:left}
.dB .ix button:hover .n{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.dB .ix .o{font-family:var(--m);font-size:11.5px;color:var(--mut)}
.dB .ix .n{font-family:var(--s);font-size:20px}
.dB .ix .n small{font-family:var(--f);font-size:12.5px;color:var(--mut);margin-left:8px}
.dB .ix .dt{font-family:var(--m);font-size:12.5px;color:var(--mut)}
.dB .ix .st{font-size:13px}
.dB .gh{margin-top:26px}
.dB .sheet{display:grid;grid-template-columns:84px minmax(0,1fr);gap:0 22px;padding:22px 0;border-bottom:1px solid var(--line)}
.dB .sheet textarea{border:0;font-family:var(--s);font-size:19px;line-height:1.55;min-height:230px;padding:0;max-width:62ch}
.dB .sheet .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.dB .sheet .lab span{color:var(--mut);font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px}
.dB .band{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:16px 40px;border-top:1px solid var(--ink);background:var(--bg)}
.dB .band .msg{flex:1;min-width:240px}
.dB .band .msg b{font-family:var(--s);font-size:19px;font-weight:500;display:block}
.dB .band.cf{background:var(--ink);color:#fff}
.dB .band.cf .btn{border-color:#8a8a8a;color:#fff}
.dB .band.cf .btn.p{background:#fff;color:var(--ink);border-color:#fff}
.dB .shero{padding:70px 40px 30px;max-width:1180px;margin:0 auto}
.dB .shero h2{font-family:var(--s);font-weight:400;font-size:108px;line-height:.92;letter-spacing:-.03em;margin:0 0 34px;max-width:9ch}
.dB .shero .lead{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;border-top:1px solid var(--ink);padding-top:22px}
.dB .shero .lead p{font-family:var(--s);font-size:22px;line-height:1.4;margin:0 0 14px}
.dB .shero .lead .sm{font-family:var(--f);font-size:14.5px;color:var(--mut)}
.dB figure{margin:0}
.dB figcaption{font-size:12.5px;color:var(--mut);padding-top:8px}
.dB .fig{border:1px solid var(--ink);padding:18px 20px;background:#fff}
.dB .pts{max-width:1180px;margin:0 auto;padding:10px 40px 60px;list-style:none}
.dB .pts li{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;padding:16px 0;border-top:1px solid var(--line)}
.dB .pts b{font-family:var(--s);font-weight:400;font-size:26px}
.dB .pts span{max-width:52ch;padding-top:6px}
@container frame (max-width:900px){
  .dB .mast,.dB .band{padding-inline:16px}.dB .pg,.dB .shero,.dB .pts{padding-inline:16px}
  .dB .mast{overflow-x:auto;flex-wrap:nowrap} .dB .mast button{white-space:nowrap}
  .dB .two,.dB .shero .lead,.dB .pts li{grid-template-columns:1fr;gap:22px}
  .dB .who h2,.dB .tools h2{font-size:34px}
  .dB .ent,.dB .sheet{grid-template-columns:54px minmax(0,1fr);gap:0 14px}.dB .ent .day{font-size:28px}
  .dB .ix button{grid-template-columns:28px minmax(0,1fr) auto;gap:10px}.dB .ix .hide{display:none}
  .dB .shero{padding-top:36px}.dB .shero h2{font-size:58px}
}

/* ═════════ C · LUCE E INCHIOSTRO ═════════ un piano illuminato sul contesto in penombra, dock, fogli, inchiostro che asciuga */

 st.innerHTML=`<div class="frame ${S.vw==='m'?'m':''}">${R[S.scr]()}</div>`;
}
function go(scr){if(scr!=='scrittura'||S.scr!=='scrittura'){if(scr==='scrittura'){S.w='draft';S.prop='pencil'}}S.scr=scr;render();window.scrollTo({top:0})}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-set],[data-go],[data-w],[data-open],[data-sel],[data-dens],[data-prop]');if(!t)return;
 if(t.dataset.prop){S.prop=t.dataset.prop;render();return}
 if(t.dataset.set){const[k,v]=t.dataset.set.split(':');S[k]=v;if(k==='scr'&&v==='scrittura')S.w='draft';if(k==='dir')S.w=S.w==='saved'?'saved':'draft';render();return}
 if(t.dataset.dens){S.dens=t.dataset.dens;render();return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.open!==undefined){S.sel=+t.dataset.open;go('scheda');return}
 if(t.dataset.sel!==undefined){S.sel=+t.dataset.sel;render();return}
 if(t.dataset.w){const w=t.dataset.w;if(w==='save'){S.w='saving';render();setTimeout(()=>{S.w=document.getElementById('err').checked?'error':'saved';render()},700)}else{S.w=w;render()}
  const f=document.querySelector('#stage [data-w],#stage .btn.p');if(f)f.focus({preventScroll:true})}
});
document.addEventListener('keydown',ev=>{
 if(S.scr!=='elenco'||!['ArrowDown','ArrowUp','j','k'].includes(ev.key))return;
 if(ev.target.matches('input,textarea,select'))return;
 const rows=[...document.querySelectorAll('#stage [data-row]')];if(!rows.length)return;
 let i=rows.indexOf(document.activeElement);i=(ev.key==='ArrowDown'||ev.key==='j')?Math.min(rows.length-1,i+1):Math.max(0,i-1);
 ev.preventDefault();
 if(S.dir==='A'||S.dir==='D'){S.sel=+rows[i].dataset.open;render();document.querySelectorAll('#stage [data-row]')[i].focus()}else rows[i].focus();
});
render();
</script>
</body></html>
